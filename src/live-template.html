<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO — live session</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-neg:#e34948;
    --good:#0ca30c; --critical:#d03b3b; --warning:#fab219; --good-text:#006300;
    --lock:#f0efec; --radius:10px;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-neg:#e66767;
    --good-text:#0ca30c; --lock:#232322;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
  h1{font-size:22px;letter-spacing:-0.02em;margin:0}
  h2{font-size:17px;letter-spacing:-0.01em;margin:0 0 10px}
  h3{font-size:14px;margin:0 0 6px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)}
  p{margin:0 0 10px}
  .muted{color:var(--muted);font-size:13px}
  a{color:var(--series-1)}
  header{display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--border);border-radius:99px;
    padding:3px 10px;color:var(--text-secondary);background:var(--surface-1)}
  .card{background:var(--surface-1);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-1);color:var(--text-primary);padding:8px 14px}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--text-primary);color:var(--page);border-color:transparent;
    font-weight:600;padding:10px 18px}
  button.primary:disabled{opacity:0.45;cursor:not-allowed}
  button.ghost{padding:6px 10px;font-size:13px}
  .choices{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
  .choice{text-align:left;padding:9px 13px;min-width:96px}
  .choice[aria-pressed="true"]{border-color:var(--text-primary);
    box-shadow:inset 0 0 0 1px var(--text-primary)}
  .choice .n{font-weight:650;font-size:14px}
  .choice .d{font-size:11.5px;color:var(--muted);max-width:210px}
  .choice.kind{max-width:250px;align-self:stretch}
  .choice.kind .d{max-width:230px}
  .choice.off{opacity:0.45;cursor:not-allowed}
  label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:3px}
  input[type=text],input[type=number]{font:inherit;width:100%;padding:8px 10px;
    border-radius:8px;border:1px solid var(--border);background:var(--page);
    color:var(--text-primary)}
  input:focus{outline:2px solid var(--series-1);outline-offset:-1px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>*{flex:1 1 190px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid)}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:600}
  td.v,th.v{text-align:right;font-variant-numeric:tabular-nums}
  tr.me td{font-weight:650}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
    border:1px solid var(--border);color:var(--muted)}
  .pill.in{color:var(--good-text);border-color:var(--good)}
  .pill.out{color:var(--warning);border-color:var(--warning)}
  .pill.dead{color:var(--critical);border-color:var(--critical)}
  .big{font-size:34px;font-weight:700;letter-spacing:-0.03em}
  .pos{color:var(--good-text)} .neg{color:var(--series-neg)}
  .bar{height:5px;background:var(--grid);border-radius:99px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--series-1)}
  .err{border-color:var(--critical);color:var(--critical)}
  .news{border-left:3px solid var(--warning);padding-left:11px;margin:8px 0;font-size:13.5px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;
    letter-spacing:0.18em;font-weight:700}
  .share{display:flex;gap:6px;align-items:center}
  .share input{font-family:ui-monospace,monospace;font-size:12.5px}
  .hidden{display:none}
  .lede{font-size:15px;color:var(--text-secondary);max-width:60ch}
  .ctrl{padding:10px 0;border-bottom:1px solid var(--grid)}
  .ctrl:last-child{border-bottom:none}
  .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:5px;flex-wrap:wrap}
  .ctrl .name{font-weight:600;font-size:13.5px}
  .ctrl .hint{font-size:11.5px;color:var(--muted)}
  .ctrl .row{display:flex;gap:10px;align-items:center}
  .ctrl .row input[type=range]{flex:1 1 auto;min-width:120px;accent-color:var(--series-1)}
  .ctrl .row input[type=number]{width:118px;flex:0 0 auto;text-align:right;
    font-variant-numeric:tabular-nums}
  .proj{position:sticky;top:12px}
  .proj .line{display:flex;justify-content:space-between;gap:12px;
    font-size:13px;padding:3px 0}
  .proj .line .k{color:var(--text-secondary)}
  .proj .line .v{font-variant-numeric:tabular-nums}
  .proj .line.total{border-top:1px solid var(--baseline,var(--border));
    margin-top:6px;padding-top:7px;font-weight:700;font-size:15px}
  .proj .sec{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--muted);margin:10px 0 2px}
  .warnbox{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;
    border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.45}
  .warnbox .ic{font-weight:700}
  .warnbox.bad{background:rgba(208,59,59,0.10);color:var(--critical)}
  .warnbox.warn{background:rgba(250,178,25,0.13);color:var(--text-primary)}
  .warnbox.ok{background:rgba(12,163,12,0.10);color:var(--good-text)}
  .layout{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.proj{position:static}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>CEO <span class="muted" style="font-weight:400">— live session</span></h1>
      <div class="muted" id="sub">One round a day. Everyone commits blind.</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="chip hidden" id="gamechip"></span>
      <button class="ghost" id="theme">Dark</button>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
/*__ENGINE__*/

/* The same economy the server runs, in the page — so the projection below is
   computed with the identical code that will resolve the round, not an
   approximation of it. That is the whole reason it can be trusted. */

const $ = (id) => document.getElementById(id);
const money = (x) => (x < 0 ? '-$' : '$') + Math.abs(Math.round(x)).toLocaleString('en-US');
const money2 = (x) => '$' + (+x).toFixed(2);
const pct = (x) => (x == null ? '—' : (x * 100).toFixed(0) + '%');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Identity lives in the browser. No accounts, no passwords: the host sends a link,
   you name your company, and the token that comes back is you. Losing it is the
   one real failure mode, so the join screen shows the personal link to keep. */
const KEY = 'ceo.live.v1';
const readAll = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const remember = (code, token, name) => {
  const all = readAll(); all[code] = { token, name, at: Date.now() };
  try { localStorage.setItem(KEY, JSON.stringify(all)); } catch {}
};
const tokenFor = (code) => (readAll()[code] || {}).token || null;

const S = { code: null, token: null, view: null, cfg: null, busy: false, error: null, tab: 'orders' };

async function api(path, body) {
  const opt = body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : {};
  const res = await fetch('/api/' + path, opt);
  const data = await res.json().catch(() => ({ error: 'The server sent something unreadable.' }));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}

function setBusy(b) { S.busy = b; render(); }
async function guard(fn) {
  S.error = null; setBusy(true);
  try { await fn(); } catch (e) { S.error = e.message; }
  setBusy(false);
}

/* ------------------------------------------------------------------ setup */
function screenHome() {
  const saved = Object.entries(readAll()).sort((a, b) => b[1].at - a[1].at).slice(0, 4);
  const L = S.cfg ? S.cfg.limits : { seats: { min: 3, max: 6, default: 4 }, rounds: { min: 8, max: 14, default: 10 } };
  const seatBtns = [];
  for (let n = L.seats.min; n <= L.seats.max; n++) {
    seatBtns.push(`<button class="choice" data-seats="${n}" aria-pressed="${n === L.seats.default}">
      <div class="n">${n} companies</div></button>`);
  }
  const CAD = (S.cfg && S.cfg.cadences) || {};
  const cadBtns = Object.entries(CAD).map(([id, c]) =>
    `<button class="choice kind" data-cadence="${id}" aria-pressed="${id === '15m'}">
      <div class="n">${esc(c.label)}</div><div class="d">${esc(c.note)}</div></button>`).join('');
  const roundBtns = [8, 10, 12, 16, 20].filter((r) => r >= L.rounds.min && r <= L.rounds.max)
    .map((r) => `<button class="choice" data-rounds="${r}" aria-pressed="${r === L.rounds.default}">
      <div class="n">${r} rounds</div></button>`).join('');
  const presets = S.cfg ? Object.entries(S.cfg.presets).map(([k, p]) =>
    `<button class="choice" data-preset="${k}" aria-pressed="${k === 'standard'}">
      <div class="n">${esc(p.label)}</div><div class="d">${esc(p.note)}</div></button>`).join('') : '';

  return `
  <div class="card">
    <h2>Start a game</h2>
    <p class="lede">You invite your friends with a link. Empty seats are filled by
      AI companies, and nobody — including you — is told which is which until the
      last round is scored.</p>
    <div style="max-width:340px;margin:14px 0 4px">
      <label for="hostname">Your company name</label>
      <input id="hostname" type="text" maxlength="28" placeholder="Ravensworth &amp; Co">
    </div>
    <h3 style="margin-top:14px">How many companies</h3>
    <div class="choices" id="seatchoice">${seatBtns.join('')}</div>
    <h3 style="margin-top:14px">How long is a round</h3>
    <div class="choices" id="cadencechoice">${cadBtns}</div>
    <div id="closehour-wrap" class="hidden" style="max-width:260px;margin:8px 0 4px">
      <label for="closehour">…closing each day at (UTC, 0–23)</label>
      <input id="closehour" type="number" min="0" max="23" value="18">
    </div>
    <h3 style="margin-top:14px">How many rounds</h3>
    <div class="choices" id="roundchoice">${roundBtns}</div>
    <p class="muted" style="margin:2px 0 10px">Everyone can see when the game ends — knowing
      that is what makes the last few rounds a real decision.</p>
    <h3>Difficulty</h3>
    <div class="choices" id="presetchoice">${presets}</div>
    <button class="primary" id="create" style="margin-top:12px">Create the game</button>
  </div>

  <div class="card">
    <h2>Join a game</h2>
    <p class="muted" style="margin-bottom:10px">Someone sent you a six-character code.</p>
    <div class="row">
      <div><label for="joincode">Game code</label>
        <input id="joincode" type="text" maxlength="6" placeholder="ABC123" style="text-transform:uppercase"></div>
      <div><label for="joinname">Your company name</label>
        <input id="joinname" type="text" maxlength="28" placeholder="Sableworth Ltd"></div>
    </div>
    <button class="primary" id="join" style="margin-top:12px">Join</button>
  </div>

  ${saved.length ? `<div class="card"><h2>Your games</h2>
    ${saved.map(([c, v]) => `<div style="display:flex;justify-content:space-between;
      align-items:center;padding:6px 0;border-bottom:1px solid var(--grid)">
      <span><b>${esc(v.name)}</b> <span class="muted">in game ${c}</span></span>
      <button class="ghost" data-resume="${c}">Open</button></div>`).join('')}
    </div>` : ''}

  <p class="muted">Practising on your own? The <a href="/">single-player levels</a>
    teach every lever this game uses.</p>`;
}

function screenLobby(v) {
  const link = location.origin + '/g/' + v.code;
  const waiting = v.seatCount - v.joined.length;
  /* Arriving on an invitation is the main way anyone reaches this page, so the
     first thing someone without a seat needs is the way to take one. */
  const takeSeat = v.you ? '' : `
  <div class="card">
    <h2>You have been invited</h2>
    <p class="lede">${esc(v.joined.map((p) => p.name).join(', '))}
      ${v.joined.length === 1 ? 'is' : 'are'} waiting to start a ${v.totalRounds}-round game.
      ${waiting > 0 ? `There ${waiting === 1 ? 'is 1 seat' : `are ${waiting} seats`} left.`
        : 'Every seat is taken.'}</p>
    ${waiting > 0 ? `
      <div style="max-width:320px;margin-top:10px">
        <label for="joinname">Name your company</label>
        <input id="joinname" type="text" maxlength="28" placeholder="Sableworth Ltd">
        <input id="joincode" type="hidden" value="${v.code}">
      </div>
      <button class="primary" id="join" style="margin-top:12px">Take a seat</button>
      <p class="muted" style="margin-top:8px">You keep this name across games.</p>`
      : `<p class="muted">Ask whoever invited you to make room, or start your own game.</p>`}
  </div>`;
  return takeSeat + `
  <div class="card">
    <h2>${v.you ? 'Waiting to start' : 'The game so far'}</h2>
    <p class="muted">Send this to the people you want in the game.</p>
    <div class="code" style="margin:8px 0 4px">${v.code}</div>
    <div class="share" style="max-width:520px">
      <input type="text" id="sharelink" readonly value="${esc(link)}">
      <button class="ghost" id="copy">Copy</button>
    </div>
    <h3 style="margin-top:18px">In the game</h3>
    <table><tbody>
      ${v.joined.map((p) => `<tr><td>${esc(p.name)}</td>
        <td class="v"><span class="pill in">joined</span></td></tr>`).join('')}
      ${Array.from({ length: waiting }, () => `<tr><td class="muted">Empty seat</td>
        <td class="v"><span class="pill">AI company if nobody takes it</span></td></tr>`).join('')}
    </tbody></table>
    <p class="muted" style="margin-top:12px">${v.seatCount} companies · ${v.totalRounds} rounds ·
      a round every ${esc((v.cadenceLabel || 'day').toLowerCase())}${v.cadenceMinutes >= 1440
        ? `, closing at ${String(v.closeHour).padStart(2, '0')}:00 UTC` : ''} ·
      ${esc(v.preset)} difficulty${v.cadenceMinutes < 1440
        ? ` · about ${Math.round(v.totalRounds * v.cadenceMinutes / 60) || '<1'} hours end to end`
        : ''}</p>
    ${v.isHost
      ? `<button class="primary" id="start" style="margin-top:6px">Start the game${waiting ? ` (${waiting} seat${waiting > 1 ? 's' : ''} become AI)` : ''}</button>`
      : `<p class="muted" style="margin-top:6px">The host starts the game when everyone is in.</p>`}
  </div>`;
}

/* ----------------------------------------------------------------- playing */
/* At a day the seconds are noise; at five minutes they are the whole tension. */
function countdown(iso) {
  if (!iso) return '';
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'closing now';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h >= 1) return `closes in ${h}h ${m}m`;
  if (m >= 5) return `closes in ${m}m`;
  return `closes in ${m}:${String(sec).padStart(2, '0')}`;
}

/* How urgent the clock is, for the header and how hard we poll. */
const isFast = () => S.view && S.view.cadenceMinutes && S.view.cadenceMinutes <= 60;

function marketTable(v) {
  return `<table>
    <thead><tr><th>Company</th><th class="v">Last price</th><th class="v">Quality</th><th class="v">Lines</th>
      <th class="v">Share</th><th class="v">This round</th></tr></thead>
    <tbody>${v.market.map((m) => `
      <tr class="${m.you ? 'me' : ''}">
        <td>${esc(m.name)}${m.you ? ' <span class="muted">(you)</span>' : ''}
          <div class="bar"><i style="width:${((m.lastShare || 0) * 100).toFixed(0)}%"></i></div></td>
        <td class="v">${m.out ? '—' : money2(m.lastPrice || 0)}</td>
        <td class="v">${m.out ? '—' : (m.quality || 0).toFixed(0)}</td>
        <td class="v">${m.out ? '—' : (m.lineCount > 1 ? m.lineCount + ' lines' : '1')}</td>
        <td class="v">${m.out ? '—' : pct(m.lastShare)}</td>
        <td class="v">${m.out ? '<span class="pill dead">out of business</span>'
          : m.filed === null ? '<span class="pill">—</span>'
          : m.filed ? '<span class="pill in">filed</span>' : '<span class="pill out">not yet</span>'}</td>
      </tr>`).join('')}</tbody></table>`;
}

function creditCard(y) {
  const c = y.credit;
  const tone = c.rate < 0.055 ? 'in' : c.rate < 0.115 ? '' : c.rate < 0.16 ? 'out' : 'dead';
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">Borrowing</h2>
      <span class="pill ${tone}">${esc(c.label)} — ${(c.rate * 100).toFixed(1)}% a round</span>
    </div>
    <p class="muted" style="margin:8px 0 10px">${esc(c.note)}
      Rates rise with how much of your credit line you have drawn, and again if the
      business behind it is losing money.</p>
    <table><tbody>
      <tr><td>Cash</td><td class="v">${money(y.cash)}</td></tr>
      <tr><td>Owed</td><td class="v ${c.drawn > 0 ? 'neg' : ''}">${money(c.drawn)}</td></tr>
      <tr><td>Still available to borrow</td><td class="v">${money(c.headroom)}</td></tr>
      ${c.drawn > 0 ? `<tr><td>Interest this round</td><td class="v neg">${money(-c.costPerRound)}</td></tr>` : ''}
      <tr class="total"><td>The bank calls it in past</td><td class="v">${money(c.limit)}</td></tr>
    </tbody></table>
    <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100, (c.drawn / c.limit) * 100).toFixed(0)}%;
      background:${c.rate < 0.08 ? 'var(--series-1)' : 'var(--series-neg)'}"></i></div>
  </div>`;
}

/* ------------------------------------------------------ the decision layer */
/* Orders being typed, keyed by product name, plus the engine objects rebuilt from
   what the server sent. Held apart from the view so that typing does not trigger a
   re-render — the form keeps focus, and only the projection repaints. */
const D = { orders: {}, firm: null, rivals: [], launch: false, launchKind: 'hardware',
            round: -1, code: null };

function hydrateFirm(v) {
  if (!v.you || !v.you.firmState) { D.firm = null; return; }
  /* Only take the server's version of what you intend when the round actually
     changes. Re-reading it on every render meant the six-second poll quietly
     un-ticked the launch box a moment after it was ticked — the intent lives here
     until it is filed, and the server has nothing newer to say about it. */
  const fresh = v.round !== D.round || v.code !== D.code;
  if (fresh) { D.orders = {}; D.round = v.round; D.code = v.code; }
  /* Products come back as plain JSON; the engine only ever reads fields off them,
     so they work as-is once the arrays are real arrays. */
  D.firm = {
    cash: v.you.firmState.cash, debt: v.you.firmState.debt,
    bankrupt: v.you.firmState.bankrupt,
    profitHistory: v.you.firmState.profitHistory || [],
    products: v.you.firmState.products.map((p) => ({ ...p })),
  };
  D.rivals = [];
  for (const m of v.market) {
    if (m.you || m.out || !m.pub) continue;
    for (const rp of m.pub) D.rivals.push(rp);
  }
  const seen = {};
  for (const p of D.firm.products) {
    const prior = D.orders[p.name];
    const fromServer = (v.you.products.find((x) => x.name === p.name) || {}).orders;
    seen[p.name] = prior || fromServer || {
      price: Math.round(value(p)),
      produce: Math.round(Math.max(0, Math.min(
        (v.you.products.find((x) => x.name === p.name) || {}).lastDemand || demandPool(p),
        effCapacity(p)) - p.inventory)),
      rd: 30000, rdProcess: 10000, advertising: 0,
      targetCapacity: Math.round(p.capacity), discontinue: false,
    };
  }
  D.orders = seen;
  if (fresh) {
    D.launch = !!v.you.wantsLaunch;
    D.launchKind = v.you.wantsLaunchKind || 'hardware';
  }
  /* A line you can no longer afford cannot stay armed. */
  if (D.launch && !v.you.canLaunch) D.launch = false;
}

/* What this product is likely to sell, given what rivals charged last round.
   Exactly the estimate the solo shared market makes: everyone else holds steady.
   They usually will not, which is the point. */
function estimateDemandFor(p, price, v) {
  const others = D.rivals;
  if (!others.length) return soloDemand(p, price, v.you.marketMult);
  return estimateShare(p, price, others, others.map((r) => r.price), v.you.marketMult);
}

/* The projection. Same arithmetic resolve() will do, on the orders as typed. */
function project(v) {
  const rows = [];
  let revenue = 0, production = 0, holding = 0, capUpkeep = 0, fixed = 0,
      rd = 0, ads = 0, capex = 0, restructure = 0, salvage = 0, plantSale = 0;
  const lines = D.firm.products.filter((p) => p.alive);

  for (const p of lines) {
    const d = D.orders[p.name];
    const pk = kindOf(p);
    if (d.discontinue) {
      restructure += C.RESTRUCTURE;
      salvage += p.invBook * C.SALVAGE;
      rows.push({ p, discontinue: true });
      continue;
    }
    const demand = estimateDemandFor(p, d.price, v);
    const sell = Math.min(Math.max(0, p.capacity - d.targetCapacity),
                          Math.max(0, p.capacity - C.CAPACITY_FLOOR));
    const build = Math.max(0, d.targetCapacity - p.capacity);
    const capNow = (p.capacity - sell) * Math.pow(p.efficiency / 100, C.THROUGHPUT_EXP)
                   * v.you.capacityMult;
    const produce = Math.max(0, Math.min(d.produce, capNow));
    const uc = unitCost(p, v.you.costMult);
    const available = p.inventory + produce;
    const sales = Math.min(demand, available);
    const leftover = available - sales;
    const unitBook = available > 0 ? (p.invBook + produce * uc) / available : 0;
    const hold = leftover * unitBook * C.HOLDING * pk.inventory;
    const upk = (p.capacity - sell) * C.CAPACITY_UPKEEP * pk.upkeep;

    revenue += sales * d.price;
    production += produce * uc;
    holding += hold;
    capUpkeep += upk;
    fixed += C.PRODUCT_FIXED * pk.fixed;
    rd += d.rd + d.rdProcess;
    ads += d.advertising;
    capex += build * C.CAPEX_PER_UNIT;
    plantSale += sell * C.CAPEX_PER_UNIT * C.CAPACITY_RESALE;

    rows.push({ p, demand, produce, sales, leftover, uc,
      lost: Math.max(0, demand - available),
      capped: d.produce > capNow + 1e-6, capNow, sell, build });
  }

  const corp = C.CORP_FIXED * Math.pow(Math.max(1, lines.length), C.CORP_SCALING);
  const interest = D.firm.debt * creditRate(D.firm, v.you.constants.CREDIT_LIMIT);
  const launchCost = D.launch ? launchCostOf(D.launchKind) : 0;
  const profit = revenue + salvage + plantSale - production - holding - capUpkeep
               - fixed - rd - ads - capex - restructure - corp - interest;
  return { rows, revenue, salvage, plantSale, production, holding, capUpkeep,
           fixed, rd, ads, capex, restructure, corp, interest, launchCost, profit };
}

function renderProjection(v) {
  const host = $('projection');
  if (!host || !D.firm) return;
  const pr = project(v);
  const L = (k, val, cls) => `<div class="line"><span class="k">${k}</span>
    <span class="v ${cls || ''}">${money(val)}</span></div>`;
  const parts = [`<div class="sec">Money in</div>`, L('Sales', pr.revenue)];
  if (pr.salvage > 0.5) parts.push(L('Stock sold off', pr.salvage));
  if (pr.plantSale > 0.5) parts.push(L('Plant sold', pr.plantSale));
  parts.push(`<div class="sec">Money out</div>`);
  parts.push(L('Making them', -pr.production, 'neg'));
  if (pr.holding > 0.5) parts.push(L('Holding stock', -pr.holding, 'neg'));
  parts.push(L('Plant upkeep', -pr.capUpkeep, 'neg'));
  parts.push(L('Fixed costs', -(pr.fixed + pr.corp), 'neg'));
  if (pr.rd > 0.5) parts.push(L('Research', -pr.rd, 'neg'));
  if (pr.ads > 0.5) parts.push(L('Advertising', -pr.ads, 'neg'));
  if (pr.capex > 0.5) parts.push(L('Building plant', -pr.capex, 'neg'));
  if (pr.restructure > 0.5) parts.push(L('Closing a line', -pr.restructure, 'neg'));
  if (pr.interest > 0.5) {
    parts.push(L(`Interest at ${(v.you.credit.rate * 100).toFixed(1)}%`, -pr.interest, 'neg'));
  }
  parts.push(`<div class="line total"><span class="k">Expected profit</span>
    <span class="v ${pr.profit >= 0 ? 'pos' : 'neg'}">${money(pr.profit)}</span></div>`);
  if (pr.launchCost) {
    parts.push(`<div class="line"><span class="k">…and ${money(pr.launchCost)} for the new
      line, paid on top</span><span class="v"></span></div>`);
  }

  /* the warnings, checked at the end of the range that actually bites */
  const w = [];
  for (const r of pr.rows) {
    if (r.discontinue) continue;
    const label = D.firm.products.filter((x) => x.alive).length > 1
      ? `${esc(kindOf(r.p).label)} line: ` : '';
    if (r.capped) {
      w.push(`<div class="warnbox warn"><span class="ic">!</span><span>${label}your factory
        can only make <b>${Math.round(r.capNow)}</b> this round — the rest of that order
        will not happen.</span></div>`);
    }
    if (r.lost > r.demand * 0.08 && r.lost > 20) {
      w.push(`<div class="warnbox warn"><span class="ic">!</span><span>${label}about
        <b>${Math.round(r.lost)}</b> buyers may find nothing in stock. Demand you cannot
        supply goes straight to whoever can.</span></div>`);
    }
    if (r.leftover > r.sales * 0.35 && r.leftover > 60) {
      w.push(`<div class="warnbox warn"><span class="ic">!</span><span>${label}you may be
        left holding <b>${Math.round(r.leftover)}</b> unsold, and holding stock costs
        ${Math.round(C.HOLDING * 100)}% of its value a round.</span></div>`);
    }
  }
  const after = D.firm.cash + pr.profit - pr.launchCost;
  if (after < 0) {
    const owed = D.firm.debt + (-after);
    const rate = creditRate({ debt: owed, profitHistory: (D.firm.profitHistory || []).concat([pr.profit]) },
                            v.you.constants.CREDIT_LIMIT);
    const band = creditStanding({ debt: owed, profitHistory: (D.firm.profitHistory || []).concat([pr.profit]) },
                                v.you.constants.CREDIT_LIMIT);
    w.push(`<div class="warnbox bad"><span class="ic">!</span><span>This plan spends
      <b>${money(-after)}</b> more than you have. You would borrow it at
      <b>${(rate * 100).toFixed(1)}%</b> a round — ${band.label.toLowerCase()}. The bank calls
      it in past ${money(v.you.constants.CREDIT_LIMIT)}.</span></div>`);
  } else if (!w.length) {
    w.push(`<div class="warnbox ok"><span class="ic">✓</span><span>Nothing obviously
      wrong with this plan. Rivals are assumed to hold their prices — they usually
      will not.</span></div>`);
  }

  host.innerHTML = `<div class="card proj"><h2>If the round ran now</h2>
    ${parts.join('')}${w.join('')}
    <p class="muted" style="margin:10px 0 0">Everyone commits blind, so this assumes
      rivals charge what they charged last round.</p></div>`;
}

/* ------------------------------------------------------------- the controls */
function ctrl(name, hint, field, pname, val, min, max, step, extra) {
  return `<div class="ctrl">
    <div class="lab"><span class="name">${name}</span><span class="hint">${hint}</span></div>
    <div class="row">
      <input type="range" min="${min}" max="${max}" step="${step}"
             value="${Math.max(min, Math.min(max, val))}" data-p="${esc(pname)}" data-field="${field}">
      <input type="number" min="0" step="${step}" value="${Math.round(val * 100) / 100}"
             data-p="${esc(pname)}" data-field="${field}">
    </div>${extra || ''}</div>`;
}

function lineForm(p, view, i) {
  const eng = D.firm.products.find((x) => x.name === p.name);
  const d = D.orders[p.name];
  const K = view.you.constants;
  const val = value(eng);
  const cap = effCapacity(eng);
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">${esc(p.label)}</h2>
      <span class="muted">${esc(p.kindLabel)} · quality ${p.quality.toFixed(0)} ·
        ${p.physical ? `${Math.round(p.inventory)} in stock` : 'nothing to warehouse'} ·
        ${p.age < 2 ? 'still ramping up' : p.age >= 8 ? 'past its best' : 'established'}</span>
    </div>
    ${ctrl('Price', `worth ${money2(val)} to a buyer`, 'price', p.name, d.price,
           (val * 0.5).toFixed(0), (val * 1.6).toFixed(0), 0.5)}
    ${ctrl('Units to make', `room for ${Math.round(cap)} · ${money2(p.unitCost)} each`,
           'produce', p.name, d.produce, 0, Math.round(cap), 10)}
    ${ctrl('Product R&amp;D — make it better', `lands in ${K.RD_DELAY} rounds`,
           'rd', p.name, d.rd, 0, 150000, 2500)}
    ${ctrl('Process R&amp;D — make it cheaper', 'also raises how much you can make',
           'rdProcess', p.name, d.rdProcess, 0, 150000, 2500)}
    ${ctrl('Advertising', `works now, fades ${Math.round(K.AD_DECAY * 100)}% a round`,
           'advertising', p.name, d.advertising, 0, 60000, 1000)}
    ${ctrl(p.physical ? 'Factory size' : 'Capacity to serve',
           `${money2(K.CAPEX_PER_UNIT)} a unit to build · ${Math.round(K.CAPACITY_RESALE * 100)}% back to sell`,
           'targetCapacity', p.name, d.targetCapacity,
           Math.round(K.CAPACITY_FLOOR), Math.round(Math.max(p.capacity * 2, 5000)), 50)}
    <label style="margin-top:10px;display:flex;gap:7px;align-items:center;font-size:13px">
      <input type="checkbox" data-p="${esc(p.name)}" data-field="discontinue"
        ${d.discontinue ? 'checked' : ''} style="width:auto">
      Discontinue this line — sell the stock and the plant, stop the fixed costs
    </label>
  </div>`;
}

function ordersForm(v) {
  const y = v.you;
  const lines = y.products.map((p, i) => lineForm(p, v, i)).join('');
  const kinds = (y.kinds || []).map((k) => `
    <button class="choice kind ${k.affordable ? '' : 'off'}" data-kind="${k.id}"
      aria-pressed="${k.id === D.launchKind}" ${k.affordable ? '' : 'disabled'}>
      <div class="n">${esc(k.label)} <span class="muted">${money(k.cost)}</span></div>
      <div class="d">${esc(k.blurb)}</div>
      <div class="d" style="margin-top:3px">${k.affordable
        ? (k.borrowing > 0
            ? `You would borrow ${money(k.borrowing)} of it — that raises your rate.`
            : 'You can pay for this out of cash.')
        : 'Out of reach right now.'}</div>
    </button>`).join('');

  return `
  <div class="layout">
    <div>
      <div class="card">
        <h2>Your orders for round ${v.round + 1}</h2>
        ${y.filed ? `<p class="muted"><span class="pill in">filed</span>
          You can change these until the round closes.</p>` : ''}
        ${y.autoRounds ? `<p class="muted">Rounds filed automatically for you so far:
          ${y.autoRounds}. Miss a deadline and your last orders simply repeat.</p>` : ''}
        ${y.products.length > 1 ? `<p class="muted">You are running ${y.products.length} lines.
          They compete with each other as well as with everyone else.</p>` : ''}
      </div>
      ${lines}
      <div class="card">
        <h2>A new product line</h2>
        <p class="muted">Starts trading next round. It carries over what your company
          already knows, but it ramps slowly and adds fixed costs from day one.</p>
        ${y.products.length >= y.maxProducts
          ? `<p class="muted">You are already running the maximum of ${y.maxProducts}.</p>`
          : y.canLaunch
            ? `<div class="choices" id="kindchoice" style="margin:10px 0 12px">${kinds}</div>
               <label style="display:flex;gap:7px;align-items:center;font-size:13.5px">
                 <input type="checkbox" id="f_launch" ${D.launch ? 'checked' : ''} style="width:auto">
                 Launch a line of the kind selected above, this round</label>
               <p class="muted" style="margin-top:8px">Launching early, while your first line
                 is still finding its feet, is how companies go under. It pays once the first
                 one is mature enough to carry it.</p>`
            : `<p class="muted">Not available: a launch has to leave you enough credit to
                 survive the new line's first rounds, and right now none of them would.</p>`}
      </div>
      <div class="card">
        <button class="primary" id="file">${y.filed ? 'Update my orders' : 'File my orders'}</button>
      </div>
    </div>
    <div id="projection"></div>
  </div>`;
}

function lastRound(v) {
  if (!v.history.length) return '';
  const h = v.history[v.history.length - 1];
  const mine = h.results.find((r) => r.seatId === (v.you && v.you.seatId));
  return `
  <div class="card">
    <h2>Round ${h.round}</h2>
    ${h.news && h.news.length ? h.news.map((n) => `<div class="news">${esc(n.text)}</div>`).join('') : ''}
    ${h.launched && h.launched.length ? h.launched.map((l) =>
      `<div class="news">${esc(l.name)} opened a new ${esc((l.kindLabel || '').toLowerCase())} line.</div>`).join('') : ''}
    ${h.inherited && h.inherited.length ? h.inherited.map((i) =>
      `<div class="news">${esc(i.name)} went out of business. About two thirds of its
        customers found a new supplier — they went to whoever was priced closest to it.</div>`).join('') : ''}
    ${mine ? `
      <div class="big ${mine.profit >= 0 ? 'pos' : 'neg'}">${money(mine.profit)}</div>
      <div class="muted" style="margin-bottom:10px">your profit${mine.auto ? ' — filed automatically from your last orders' : ''}</div>
      <table><tbody>
        <tr><td>You sold</td><td class="v">${Math.round(mine.sales)} units at ${money2(mine.price)}</td></tr>
        <tr><td>People wanted</td><td class="v">${Math.round(mine.demand)} units</td></tr>
        <tr><td>Your share</td><td class="v">${pct(mine.share)}</td></tr>
        <tr><td>Revenue</td><td class="v">${money(mine.revenue)}</td></tr>
        ${mine.interest > 0 ? `<tr><td>Interest at ${(mine.rate * 100).toFixed(1)}%</td>
          <td class="v neg">${money(-mine.interest)}</td></tr>` : ''}
        <tr><td>Costs</td><td class="v neg">${money(-mine.costs)}</td></tr>
        <tr class="me"><td>Cash now</td><td class="v">${money(mine.cash)}</td></tr>
      </tbody></table>` : ''}
    <h3 style="margin-top:16px">What everyone charged</h3>
    <table><thead><tr><th>Company</th><th class="v">Price</th><th class="v">Share</th><th class="v">Advertising</th></tr></thead>
      <tbody>${h.results.map((r) => `<tr class="${r.seatId === (v.you && v.you.seatId) ? 'me' : ''}">
        <td>${esc(r.name)}${r.bankrupt ? ' <span class="pill dead">out</span>' : ''}</td>
        <td class="v">${money2(r.price)}</td><td class="v">${pct(r.share)}</td>
        <td class="v">${money(r.advertising)}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

function screenPlaying(v) {
  const y = v.you;
  const waiting = v.waitingOn.length;
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">Round ${v.round + 1} of ${v.totalRounds}</h2>
      <div class="muted" id="clock" data-rest="${esc(waiting
        ? ' · waiting on ' + v.waitingOn.join(', ')
        : ' · everyone has filed')}">${countdown(v.deadline)}${waiting
        ? ` · waiting on ${v.waitingOn.map(esc).join(', ')}`
        : ' · everyone has filed'}</div>
    </div>
    <p class="muted" style="margin:8px 0 12px">Prices and shares below are <b>last round's</b>.
      Nobody can see this round's until it closes.</p>
    ${marketTable(v)}
  </div>
  ${y && !y.bankrupt ? creditCard(y) : ''}
  ${y && y.products && y.products.length && !y.bankrupt ? ordersForm(v)
    : y ? `<div class="card"><h2>You are out of the game</h2>
        <p class="muted">Your debt passed the limit and the bank called it in. You can still
        watch the rest of the game and see the reveal at the end.</p></div>`
    : `<div class="card"><h2>You are watching</h2>
        <p class="muted">This game has already started, so there is no seat for you — but you
        can follow it, and you will see who was who at the end.
        <a href="/g/">Start your own game</a>.</p></div>`}
  ${lastRound(v)}`;
}

function screenOver(v) {
  const rows = v.market.slice().sort((a, b) => b.finalValue - a.finalValue);
  const mine = rows.findIndex((r) => r.you);
  return `
  <div class="card">
    <h2>Game over</h2>
    ${mine >= 0 ? `<div class="big">${['1st', '2nd', '3rd', '4th', '5th', '6th'][mine]}</div>
      <div class="muted" style="margin-bottom:12px">of ${rows.length} companies</div>` : ''}
    <p class="lede">Here is who everyone actually was.</p>
    <table><thead><tr><th>#</th><th>Company</th><th class="v">Final value</th><th>What it was</th></tr></thead>
      <tbody>${rows.map((m, i) => `<tr class="${m.you ? 'me' : ''}">
        <td>${i + 1}</td>
        <td>${esc(m.name)}${m.out ? ' <span class="pill dead">went under</span>' : ''}</td>
        <td class="v">${money(m.finalValue)}</td>
        <td class="muted">${m.isBot ? esc(m.strategy || 'an AI company') : 'a person'}</td>
      </tr>`).join('')}</tbody></table>
    <p class="muted" style="margin-top:14px">Companies are valued at cash, stock at salvage,
      plus four times what the products still earn — which is why running one into the
      ground to bank the cash scores badly.</p>
    <button class="primary" id="home" style="margin-top:6px">Start another game</button>
  </div>
  ${lastRound(v)}`;
}

/* ------------------------------------------------------------------ render */
function render() {
  const app = $('app');
  const v = S.view;
  if (v && v.status === 'playing') hydrateFirm(v);
  $('gamechip').classList.toggle('hidden', !S.code);
  if (S.code) $('gamechip').textContent = 'Game ' + S.code;
  $('sub').textContent = v && v.cadenceLabel
    ? `A round every ${v.cadenceLabel.toLowerCase()}. Everyone commits blind.`
    : 'You choose how long a round lasts. Everyone commits blind.';
  let html = '';
  if (S.error) html += `<div class="card err"><b>${esc(S.error)}</b></div>`;
  if (!v) html += screenHome();
  else if (v.status === 'lobby') html += screenLobby(v);
  else if (v.status === 'over') html += screenOver(v);
  else html += screenPlaying(v);
  app.innerHTML = html;
  if (S.busy) app.style.opacity = '0.6'; else app.style.opacity = '1';
  if (v && v.status === 'playing' && v.you && D.firm) renderProjection(v);
}

/* --------------------------------------------------------------- behaviour */
const pressed = (host) => {
  const el = document.querySelector(`#${host} .choice[aria-pressed="true"]`);
  return el ? el.dataset : {};
};

/* Typing must not re-render the page: the form would lose focus mid-number. Only
   the paired control and the projection are updated. */
document.addEventListener('input', (e) => {
  const t = e.target;
  const name = t.dataset && t.dataset.p;
  const field = t.dataset && t.dataset.field;
  if (!name || !field || !D.orders[name]) return;
  if (field === 'discontinue') {
    D.orders[name].discontinue = t.checked;
  } else {
    const n = Number(t.value);
    if (!Number.isFinite(n)) return;
    D.orders[name][field] = Math.max(0, n);
    document.querySelectorAll(`[data-p="${CSS.escape(name)}"][data-field="${field}"]`)
      .forEach((el) => { if (el !== t) el.value = t.value; });
  }
  if (S.view) renderProjection(S.view);
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'f_launch') {
    D.launch = e.target.checked;
    if (S.view) renderProjection(S.view);
  }
});

document.addEventListener('click', (e) => {
  const c = e.target.closest('.choice');
  if (c && c.parentElement.classList.contains('choices')) {
    c.parentElement.querySelectorAll('.choice').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    c.setAttribute('aria-pressed', 'true');
    /* a fixed hour of the day means nothing when a round lasts five minutes */
    if (c.parentElement.id === 'cadencechoice') {
      const w = $('closehour-wrap');
      if (w) w.classList.toggle('hidden', c.dataset.cadence !== '1d');
    }
    if (c.parentElement.id === 'kindchoice') {
      D.launchKind = c.dataset.kind;
      if (S.view) renderProjection(S.view);
    }
    return;
  }
  const t = e.target;

  if (t.id === 'theme') {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    t.textContent = dark ? 'Dark' : 'Light';
    return;
  }
  if (t.id === 'copy') {
    const el = $('sharelink'); el.select();
    navigator.clipboard.writeText(el.value).then(() => { t.textContent = 'Copied'; });
    return;
  }
  if (t.dataset.resume) { open(t.dataset.resume); return; }
  if (t.id === 'home') { S.code = null; S.token = null; S.view = null; history.pushState({}, '', '/g/'); render(); return; }

  if (t.id === 'create') {
    /* Read every field BEFORE guard() runs — it re-renders to show the busy
       state, which rebuilds this screen and resets the buttons. Reading inside
       the callback silently gave every game the default settings. */
    const opts = {
      hostName: $('hostname').value.trim(),
      seats: +(pressed('seatchoice').seats || 4),
      rounds: +(pressed('roundchoice').rounds || 10),
      preset: pressed('presetchoice').preset || 'standard',
      cadence: pressed('cadencechoice').cadence || '15m',
      closeHour: +(($('closehour') || {}).value || 18),
    };
    guard(async () => {
      const r = await api('create', opts);
      const name = opts.hostName;
      S.code = r.code; S.token = r.token; S.view = r.view;
      remember(r.code, r.token, name);
      history.pushState({}, '', '/g/' + r.code);
    });
    return;
  }
  if (t.id === 'join') {
    const code = $('joincode').value.trim().toUpperCase();
    const name = $('joinname').value.trim();
    guard(async () => {
      const r = await api('join', { code, name });   // read above, before the re-render
      S.code = r.code; S.token = r.token; S.view = r.view;
      remember(r.code, r.token, name);
      history.pushState({}, '', '/g/' + r.code);
    });
    return;
  }
  if (t.id === 'start') {
    guard(async () => { S.view = (await api('start', { code: S.code, token: S.token })).view; });
    return;
  }
  if (t.id === 'file') {
    /* The orders live in D, kept current as they are typed — nothing to scrape
       out of the DOM, and nothing lost when the busy state re-renders. */
    const products = {};
    for (const [name, d] of Object.entries(D.orders)) products[name] = { ...d };
    const decisions = { products, launch: D.launch, launchKind: D.launchKind };
    guard(async () => {
      S.view = (await api('submit', { code: S.code, token: S.token, decisions })).view;
    });
  }
});

async function refresh() {
  if (!S.code) return;
  try {
    const r = await api('state?code=' + encodeURIComponent(S.code) +
      (S.token ? '&token=' + encodeURIComponent(S.token) : ''));
    S.view = r.view; render();
  } catch (e) { S.error = e.message; render(); }
}

async function open(code) {
  S.code = code.toUpperCase();
  S.token = tokenFor(S.code);
  history.pushState({}, '', '/g/' + S.code);
  await guard(refresh);
}

/* A game code in the URL is how an invitation arrives. */
async function boot() {
  try { S.cfg = await api('config'); } catch {}
  const m = location.pathname.match(/\/g\/([A-Za-z0-9]{6})/);
  if (m) { await open(m[1]); } else { render(); }
  /* How often to check depends entirely on how fast the game is: a daily round
     changes nothing in a minute, a five-minute round changes everything. */
  let lastPoll = 0;
  setInterval(() => {
    if (!S.code || S.busy) return;
    const gap = isFast() ? 6000 : 25000;
    if (Date.now() - lastPoll < gap) return;
    lastPoll = Date.now();
    refresh();
  }, 2000);
  /* and repaint the clock itself, so the countdown actually counts down */
  setInterval(() => {
    const v = S.view;
    if (!v || v.status !== 'playing' || S.busy) return;
    const el = document.getElementById('clock');
    if (el) el.textContent = countdown(v.deadline) + el.dataset.rest;
  }, 1000);
}

if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.setAttribute('data-theme', 'dark');
  $('theme').textContent = 'Light';
}
window.addEventListener('popstate', boot);
boot();
</script>
</body></html>
