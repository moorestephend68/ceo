[build]
  publish = "public"
  command = "echo 'static site — nothing to build'"

[build.environment]
  # the functions use ESM, top-level await and the platform fetch
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/g/*"
  to = "/live.html"
  status = 200
