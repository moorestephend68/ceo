<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO — live session</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-neg:#e34948;
    --good:#0ca30c; --critical:#d03b3b; --warning:#fab219; --good-text:#006300;
    --lock:#f0efec; --radius:10px;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-neg:#e66767;
    --good-text:#0ca30c; --lock:#232322;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
  h1{font-size:22px;letter-spacing:-0.02em;margin:0}
  h2{font-size:17px;letter-spacing:-0.01em;margin:0 0 10px}
  h3{font-size:14px;margin:0 0 6px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)}
  p{margin:0 0 10px}
  .muted{color:var(--muted);font-size:13px}
  a{color:var(--series-1)}
  header{display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--border);border-radius:99px;
    padding:3px 10px;color:var(--text-secondary);background:var(--surface-1)}
  .card{background:var(--surface-1);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-1);color:var(--text-primary);padding:8px 14px}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--text-primary);color:var(--page);border-color:transparent;
    font-weight:600;padding:10px 18px}
  button.primary:disabled{opacity:0.45;cursor:not-allowed}
  button.ghost{padding:6px 10px;font-size:13px}
  .choices{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
  .choice{text-align:left;padding:9px 13px;min-width:96px}
  .choice[aria-pressed="true"]{border-color:var(--text-primary);
    box-shadow:inset 0 0 0 1px var(--text-primary)}
  .choice .n{font-weight:650;font-size:14px}
  .choice .d{font-size:11.5px;color:var(--muted);max-width:210px}
  .choice.kind{max-width:250px;align-self:stretch}
  .choice.kind .d{max-width:230px}
  .choice.off{opacity:0.45;cursor:not-allowed}
  label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:3px}
  input[type=text],input[type=number]{font:inherit;width:100%;padding:8px 10px;
    border-radius:8px;border:1px solid var(--border);background:var(--page);
    color:var(--text-primary)}
  input:focus{outline:2px solid var(--series-1);outline-offset:-1px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>*{flex:1 1 190px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid)}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:600}
  td.v,th.v{text-align:right;font-variant-numeric:tabular-nums}
  tr.me td{font-weight:650}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
    border:1px solid var(--border);color:var(--muted)}
  .pill.in{color:var(--good-text);border-color:var(--good)}
  .pill.out{color:var(--warning);border-color:var(--warning)}
  .pill.dead{color:var(--critical);border-color:var(--critical)}
  .big{font-size:34px;font-weight:700;letter-spacing:-0.03em}
  .pos{color:var(--good-text)} .neg{color:var(--series-neg)}
  .bar{height:5px;background:var(--grid);border-radius:99px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--series-1)}
  .err{border-color:var(--critical);color:var(--critical)}
  .news{border-left:3px solid var(--warning);padding-left:11px;margin:8px 0;font-size:13.5px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;
    letter-spacing:0.18em;font-weight:700}
  .share{display:flex;gap:6px;align-items:center}
  .share input{font-family:ui-monospace,monospace;font-size:12.5px}
  .hidden{display:none}
  .lede{font-size:15px;color:var(--text-secondary);max-width:60ch}
  .ctrl{padding:10px 0;border-bottom:1px solid var(--grid)}
  .ctrl:last-child{border-bottom:none}
  .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:5px;flex-wrap:wrap}
  .ctrl .name{font-weight:600;font-size:13.5px}
  .ctrl .hint{font-size:11.5px;color:var(--muted)}
  .ctrl .row{display:flex;gap:10px;align-items:center}
  .ctrl .row input[type=range]{flex:1 1 auto;min-width:120px;accent-color:var(--series-1)}
  .ctrl .row input[type=number]{width:118px;flex:0 0 auto;text-align:right;
    font-variant-numeric:tabular-nums}
  .proj{position:sticky;top:12px}
  .proj .line{display:flex;justify-content:space-between;gap:12px;
    font-size:13px;padding:3px 0}
  .proj .line .k{color:var(--text-secondary)}
  .proj .line .v{font-variant-numeric:tabular-nums}
  .proj .line.total{border-top:1px solid var(--baseline,var(--border));
    margin-top:6px;padding-top:7px;font-weight:700;font-size:15px}
  .proj .sec{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--muted);margin:10px 0 2px}
  .warnbox{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;
    border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.45}
  .warnbox .ic{font-weight:700}
  .warnbox.bad{background:rgba(208,59,59,0.10);color:var(--critical)}
  .warnbox.warn{background:rgba(250,178,25,0.13);color:var(--text-primary)}
  .warnbox.ok{background:rgba(12,163,12,0.10);color:var(--good-text)}
  .layout{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.proj{position:static}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>CEO <span class="muted" style="font-weight:400">— live session</span></h1>
      <div class="muted" id="sub">One round a day. Everyone commits blind.</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="chip hidden" id="gamechip"></span>
      <button class="ghost" id="theme">Dark</button>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
/* CEO — economy engine (JS port of ceo_engine.py).
   Practice level uses the solo path: no shocks, no rivals, exact forecast. */

const C = {
  ELASTICITY: 2.0,
  VALUE_REF: 100.0,
  QUALITY_REACH: 0.60,
  QUALITY_DECAY: 0.04,
  RD_K: 1.5,
  RD_DELAY: 2,
  UNIT_COST0: 45.0,
  LEARN_REF: 2000.0,
  LEARN_EXP: -0.12,
  LEARN_FLOOR: 0.60,
  HOLDING: 0.22,
  OBSOLESCENCE: 0.10,
  SALVAGE: 0.40,
  STOCKOUT_PEN: 0.90,
  PRODUCT_FIXED: 40000.0,
  CORP_FIXED: 25000.0,
  CORP_SCALING: 1.30,
  CAPACITY0: 2200.0,
  CAPEX_PER_UNIT: 18.0,
  CAPACITY_UPKEEP: 5.0,
  CAPACITY_RESALE: 0.40,
  CAPACITY_FLOOR: 400.0,
  RD_K_PROC: 1.5,
  EFFICIENCY_DECAY: 0.02,
  EFFICIENCY_FLOOR: 0.55,
  THROUGHPUT_EXP: 0.50,
  LAUNCH_COST: 180000.0,
  MAX_PRODUCTS: 3,           // more than three lines is bookkeeping, not strategy
  /* A second line from an established company is not a startup's product. It
     carries the firm's accumulated know-how, which is both realistic and the only
     thing that makes launching survivable: a fresh product at quality 100 against
     incumbents at 130 cannot get share, for exactly the reason a new entrant
     cannot (§17). Unlike a raw quality gift to an outsider, this scales with the
     launcher — a strong company's second line starts strong, a weak one's does
     not — so it does not have the "no setting in between" problem. */
  /* A launch must leave enough credit behind to survive the ramp. Without this the
     affordability test passed on paper and killed the company two rounds later:
     it would let a firm borrow most of its line to launch, then meet a ramp round
     that costs ~$87,000 more than the one before it with nothing left to draw. */
  LAUNCH_RESERVE: 135000.0,
  LINE_QUALITY_INHERIT: 0.85,
  LINE_EFFICIENCY_INHERIT: 0.90,
  MARKET_BASE: 2000.0,
  MATURITY_ROUND: 8,
  DECLINE: 0.08,
  RAMP: [0.65, 0.90],
  CREDIT_LIMIT: 200000.0,
  /* Borrowing is priced on how healthy the company looks, the way it is in the
     real market. As of August 2026 investment-grade paper trades around 1% over
     treasuries, all high yield around 2.7%, and CCC-and-lower at 10.2% — roughly
     a tenfold span from sound to distressed. These numbers reproduce that shape
     around the flat 5% the economy was originally balanced at. */
  INTEREST: 0.05,            // retained: the rate a debt-free company would pay
  RATE_BASE: 0.04,           // a company with no debt and profits behind it
  RATE_LEVERAGE: 0.10,       // ...rising with how much of the credit line is used
  RATE_LEVERAGE_EXP: 1.40,   // slowly at first, then quickly
  RATE_LOSSES: 0.05,         // ...and again if the business is losing money
  RATE_LOSS_REF: 80000.0,    // a loss this size counts as fully impaired
  RATE_LOSS_FLOOR: 0.20,     // ...but losses only bite in proportion to what is owed
  RATE_MAX: 0.22,            // the point past which nobody would lend at all
  RESTRUCTURE: 20000.0,
  /* --- shared market (Level 3) --- */
  SHARE_BETA: 2.3,        // share sensitivity to value-for-money
  QUALITY_PULL: 3.2,      // ...and to raw quality
  AD_GAMMA: 0.8,          // ...and to awareness
  CATEGORY_ELAST: 0.8,    // cheap prices barely grow the category; they steal share
  AD_K: 8.0,
  AD_DECAY: 0.55,         // awareness is rented, not owned
  AD_AWARE_CAP: 80.0,
  /* --- what happens when a company leaves the market --- */
  INHERIT_SHARE: 0.65,     // only this much of its demand finds a new home
  INHERIT_DECAY: 0.30,     // and the advantage fades this fast
  INHERIT_AFFINITY: 12.0,  // customers go to whoever is priced closest to what they lost
};

/* ==================== what kind of thing you make ====================
   Every constant above describes a manufactured physical good: materials in each
   unit, a factory that costs money standing idle, a warehouse, stock that rots,
   and a learning curve. That is one kind of business, not all of them. Software
   has no factory and nothing to warehouse but expensive people and a short shelf
   life; a commodity is quick and cheap and cannot be innovated into a premium;
   deep tech costs more of everything and pays back only if the research lands.

   These are multipliers on the baseline, so `hardware` is exactly the economy
   every figure in the design doc was measured against — nothing already balanced
   moves. A company always starts with a hardware product; the kind is chosen when
   launching a new line. */

const KINDS = {
  hardware: {
    label: 'Hardware',
    blurb: 'Materials in every unit and a factory to build them. Gets cheaper the more you make.',
    launch: 1.00, fixed: 1.00, unitCost: 1.00, learn: 1.00,
    capacity: 1.00, upkeep: 1.00, inventory: 1.00,
    rdLeverage: 1.00, rdDelay: 0, decay: 1.00,
  },
  software: {
    label: 'Software',
    blurb: 'No factory, nothing to warehouse, almost nothing per copy — but the people cost a fortune and it goes stale fast.',
    launch: 1.00, fixed: 1.75, unitCost: 0.09, learn: 0.15,
    capacity: 3.00, upkeep: 0.20, inventory: 0.00,
    rdLeverage: 1.15, rdDelay: 0, decay: 1.60,
  },
  commodity: {
    label: 'Commodity',
    blurb: 'Cheap and quick to start. Thin margins, and research barely moves it.',
    launch: 0.39, fixed: 0.65, unitCost: 0.62, learn: 1.00,
    capacity: 0.80, upkeep: 0.90, inventory: 1.00,
    rdLeverage: 0.45, rdDelay: 0, decay: 0.70,
  },
  deeptech: {
    label: 'Deep tech',
    blurb: 'Slow, dear and complicated to build — but research compounds hard once it lands.',
    launch: 1.15, fixed: 1.38, unitCost: 1.15, learn: 1.00,
    capacity: 1.00, upkeep: 1.00, inventory: 1.00,
    rdLeverage: 1.70, rdDelay: 1, decay: 1.00,
  },
};

const kindOf = (p) => KINDS[(p && p.kind) || 'hardware'] || KINDS.hardware;
const launchCostOf = (kind) => C.LAUNCH_COST * (KINDS[kind] || KINDS.hardware).launch;

let _pid = 0;
function newProduct(name, kind) {
  return {
    id: ++_pid,
    name,
    quality: 100.0,
    age: 0,
    inventory: 0.0,
    invBook: 0.0,
    cumUnits: C.LEARN_REF,
    kind: KINDS[kind] ? kind : 'hardware',
    capacity: C.CAPACITY0 * (KINDS[kind] || KINDS.hardware).capacity,
    alive: true,
    efficiency: 100.0,   // higher = cheaper to build and more output per plant
    awareness: 0.0,      // advertising stock: pulls SHARE, never demand
    inherited: 0.0,      // customers picked up from a company that left
    rdPipeline: [],      // {lands, dq, spend}
    procPipeline: [],    // {lands, de, spend}
    pendingCapacity: 0.0,
    stockoutLast: false,
    profitHistory: [],
  };
}

function newFirm(cash) {
  return { cash: cash === undefined ? 250000.0 : cash, debt: 0.0, products: [],
           bankrupt: false, profitHistory: [] };
}

const live = (firm) => firm.products.filter((p) => p.alive);

/* What this company pays to borrow, and what to call it.

   Two things move it, and both are things a player can see coming: how much of
   the credit line is already drawn, and whether the business behind the debt is
   making money. Leverage is superlinear — the first quarter of the line is nearly
   free, the last quarter is punishing — which is what makes borrowing early to
   fund something that pays off a genuinely different decision from borrowing late
   to cover a loss. */
function creditRate(firm, creditLimit) {
  const limit = creditLimit === undefined ? C.CREDIT_LIMIT : creditLimit;
  const lev = Math.max(0, Math.min(1, firm.debt / Math.max(1, limit)));
  const hist = firm.profitHistory || [];
  const recent = hist.slice(-3);
  const avg = recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0;
  const impaired = avg < 0 ? Math.min(1, -avg / C.RATE_LOSS_REF) : 0;
  /* Losses are charged in proportion to how much is already drawn. A lender
     prices your ability to repay what you owe — and a company that owes nothing
     is not distressed no matter how its quarter went. Without this, a brand new
     company was rated Stretched in round one purely for the ordinary cost of
     starting up. */
  const exposure = Math.min(1, C.RATE_LOSS_FLOOR + lev);
  const rate = C.RATE_BASE
    + C.RATE_LEVERAGE * Math.pow(lev, C.RATE_LEVERAGE_EXP)
    + C.RATE_LOSSES * impaired * exposure;
  return Math.min(C.RATE_MAX, rate);
}

/* Plain language for the same thing. Players should not have to learn a ratings
   scale to understand that the bank has gone cold on them. */
function creditStanding(firm, creditLimit) {
  const r = creditRate(firm, creditLimit);
  if (r < 0.055) return { label: 'Strong', note: 'Lenders like the look of you.' };
  if (r < 0.080) return { label: 'Sound', note: 'Normal terms.' };
  if (r < 0.115) return { label: 'Stretched', note: 'Borrowing is getting expensive.' };
  if (r < 0.160) return { label: 'Strained', note: 'The bank is charging you for the risk.' };
  return { label: 'Distressed', note: 'You are paying penalty rates on every dollar owed.' };
}

const value = (p) => C.VALUE_REF * (p.quality / 100.0);

function unitCost(p, costShock) {
  const shock = costShock === undefined ? 1.0 : costShock;
  const k = kindOf(p);
  const f = Math.max(C.LEARN_FLOOR, Math.pow(p.cumUnits / C.LEARN_REF, C.LEARN_EXP * k.learn));
  const eff = Math.max(C.EFFICIENCY_FLOOR, 100.0 / Math.max(p.efficiency, 1.0));
  return C.UNIT_COST0 * k.unitCost * f * eff * shock;
}

/* Process R&D raises throughput as well as cutting cost, so it is a genuine
   alternative to buying more plant. */
function effCapacity(p) {
  return p.capacity * Math.pow(p.efficiency / 100.0, C.THROUGHPUT_EXP);
}

function demandPool(p, marketMult) {
  const mm = marketMult === undefined ? 1.0 : marketMult;
  const ramp = p.age < C.RAMP.length ? C.RAMP[p.age] : 1.0;
  let decline = 1.0;
  if (p.age >= C.MATURITY_ROUND) {
    decline = Math.pow(1 - C.DECLINE, p.age - C.MATURITY_ROUND + 1);
  }
  const reach = Math.pow(p.quality / 100.0, C.QUALITY_REACH);
  let pool = (C.MARKET_BASE + p.inherited) * ramp * decline * reach * mm;
  if (p.stockoutLast) pool *= C.STOCKOUT_PEN;
  return pool;
}

const priceMultiplier = (price, val) =>
  Math.max(0.0, 1 + C.ELASTICITY * (1 - price / val));

const soloDemand = (p, price, marketMult) =>
  demandPool(p, marketMult) * priceMultiplier(price, value(p));

/* ---------------- PHASE A ---------------- */
function upkeep(firm, roundNo) {
  const landed = [];
  for (const p of live(firm)) {
    const due = p.rdPipeline.filter((r) => r.lands <= roundNo);
    const gain = due.reduce((a, r) => a + r.dq, 0);
    if (gain > 0) landed.push({ product: p.name, gain });
    p.quality += gain;
    p.rdPipeline = p.rdPipeline.filter((r) => r.lands > roundNo);
    const dueP = p.procPipeline.filter((r) => r.lands <= roundNo);
    const gainE = dueP.reduce((a, r) => a + r.de, 0);
    if (gainE > 0) landed.push({ product: p.name, efficiency: gainE });
    p.efficiency += gainE;
    p.procPipeline = p.procPipeline.filter((r) => r.lands > roundNo);
    const capAdded = p.pendingCapacity;
    p.capacity += p.pendingCapacity;
    p.pendingCapacity = 0.0;
    if (capAdded > 0) landed.push({ product: p.name, capacity: capAdded });
    p.quality *= 1 - C.QUALITY_DECAY * kindOf(p).decay;
    p.efficiency *= 1 - C.EFFICIENCY_DECAY;
    p.awareness *= 1 - C.AD_DECAY;
    p.inherited *= 1 - C.INHERIT_DECAY;
    p.invBook *= 1 - C.OBSOLESCENCE * kindOf(p).inventory;
  }
  return landed;
}

/* Advertising buys awareness the same round it is spent, and awareness feeds
   SHARE — so in a shared market it has to land before demand is split. The caller
   runs this for every firm first, which keeps the ordering identical to Python. */
function applyAdvertising(firm, decisions) {
  for (const p of live(firm)) {
    const ad = (decisions[p.name] || {}).advertising || 0;
    if (ad > 0) {
      p.awareness = Math.min(C.AD_AWARE_CAP,
        p.awareness + C.AD_K * Math.sqrt(ad / 1000.0));
    }
  }
}

/* When a company leaves, its customers do not evaporate — but neither do they all
   find a new supplier. About two thirds land somewhere; the rest simply stop
   buying, because nobody has the capacity or the proposition to serve them. And
   they go to the closest substitute, not the biggest survivor: when Spirit failed,
   its traffic went to JetBlue, Breeze, Frontier and Allegiant, and none of it went
   to the legacy carriers. */
function distributeCustomers(leaver, survivors, leaverPrice, prices) {
  const orphaned = live(leaver).reduce((a, p) => a + C.MARKET_BASE + p.inherited, 0)
                 * C.INHERIT_SHARE;
  const pool = [];
  for (const f of survivors) if (!f.bankrupt) for (const p of live(f)) pool.push(p);
  if (!pool.length || orphaned <= 0) return { orphaned: 0, shares: [] };
  const affinity = (p) => {
    if (leaverPrice === undefined || !prices || prices[p.name] === undefined) return 1;
    const gap = Math.abs(Math.log(Math.max(prices[p.name], 1e-6) / Math.max(leaverPrice, 1e-6)));
    return Math.exp(-C.INHERIT_AFFINITY * gap);
  };
  const weights = pool.map((p) => demandPool(p) * affinity(p));
  const total = weights.reduce((a, b) => a + b, 0) || pool.length;
  const shares = [];
  pool.forEach((p, i) => {
    const got = orphaned * (weights[i] / total);
    p.inherited += got;
    shares.push({ product: p, units: got, fraction: weights[i] / total });
  });
  return { orphaned, shares };
}

/* ---------------- shared market ---------------- */
/* entries: [{product, price}] across every firm. Three kinds of buyer. */
function sharedDemands(entries, marketMult) {
  const mm = marketMult === undefined ? 1 : marketMult;
  const vbar = entries.reduce((a, e) => a + value(e.product), 0) / Math.max(1, entries.length);
  const attr = entries.map((e) => e.price > 0
    ? Math.pow(value(e.product) / e.price, C.SHARE_BETA)
      * Math.pow(value(e.product) / vbar, C.QUALITY_PULL)
      * Math.pow(1 + e.product.awareness / 100, C.AD_GAMMA)
    : 0);
  const tot = attr.reduce((a, b) => a + b, 0) || 1;
  const shares = attr.map((a) => a / tot);
  const pbar = entries.reduce((a, e, i) => a + e.price * shares[i], 0);
  const vbarW = entries.reduce((a, e, i) => a + value(e.product) * shares[i], 0);
  const pool = entries.reduce((a, e) => a + demandPool(e.product, mm), 0);
  const total = pool * Math.max(0, 1 + C.CATEGORY_ELAST * (1 - pbar / vbarW));
  return { demands: shares.map((s) => total * s), shares };
}

/* Demand a firm cannot fill spills to rivals that still have stock. */
function spill(demands, availables) {
  const n = demands.length;
  const sales = new Array(n).fill(0);
  const remD = demands.slice();
  const remA = availables.slice();
  for (let pass = 0; pass < 5; pass++) {
    let unmet = 0;
    for (let i = 0; i < n; i++) {
      const take = Math.min(remD[i], remA[i]);
      sales[i] += take; remA[i] -= take; unmet += remD[i] - take; remD[i] = 0;
    }
    if (unmet <= 1e-6) break;
    const spare = remA.map((a) => Math.max(0, a));
    const tot = spare.reduce((a, b) => a + b, 0);
    if (tot <= 1e-6) break;
    for (let i = 0; i < n; i++) remD[i] = unmet * (spare[i] / tot);
  }
  return sales;
}

/* ---------------- PHASE C ---------------- */
function resolve(firm, decisions, roundNo, opts) {
  const o = opts || {};
  const marketMult = o.marketMult === undefined ? 1.0 : o.marketMult;
  const costShock = o.costShock === undefined ? 1.0 : o.costShock;
  const capacityMult = o.capacityMult === undefined ? 1.0 : o.capacityMult;

  let revenue = 0.0, costs = 0.0;
  const log = [];
  const liveList = live(firm);

  /* In a shared market the caller has already split demand between firms and
     passes each firm its slice. Only compute demand here when playing solo. */
  const demands = {};
  for (const p of liveList) {
    demands[p.name] = (o.sharedDemands && o.sharedDemands[p.name] !== undefined)
      ? o.sharedDemands[p.name]
      : soloDemand(p, decisions[p.name].price, marketMult);
  }

  const availables = {};
  const unitCosts = {};
  for (const p of liveList) {
    const d = decisions[p.name];
    if (d.discontinue) continue;
    const sell = Math.min(Math.max(0.0, d.sellCapacity || 0.0),
                          Math.max(0.0, p.capacity - C.CAPACITY_FLOOR));
    if (sell > 0) { p.capacity -= sell; d._soldCapacity = sell; }
    const produce = Math.max(0.0, Math.min(d.produce, effCapacity(p) * capacityMult));
    const uc = unitCost(p, costShock);
    unitCosts[p.name] = uc;
    costs += produce * uc;
    p.cumUnits += produce;
    p.invBook += produce * uc;
    availables[p.name] = p.inventory + produce;
    d._produced = produce;
  }

  for (const p of liveList) {
    const d = decisions[p.name];
    if (d.discontinue) {
      costs += C.RESTRUCTURE;
      revenue += p.invBook * C.SALVAGE;
      log.push({
        name: p.name, event: 'discontinued', profit: 0,
        salvage: p.invBook * C.SALVAGE, restructure: C.RESTRUCTURE,
      });
      p.alive = false;
      p.inventory = 0.0;
      p.invBook = 0.0;
      continue;
    }

    const available = availables[p.name];
    const demand = demands[p.name];
    const sales = Math.min(demand, available);
    p.stockoutLast = demand > available + 1e-6;
    const unitBook = available > 0 ? p.invBook / available : 0.0;
    const cogs = sales * unitBook;
    p.inventory = available - sales;
    p.invBook = p.inventory * unitBook;
    revenue += sales * d.price;
    const pk = kindOf(p);
    const holding = p.invBook * C.HOLDING * pk.inventory;
    const upkeepCost = p.capacity * C.CAPACITY_UPKEEP * pk.upkeep;
    const rd = d.rd || 0.0;
    const rdProcess = d.rdProcess || 0.0;
    const advertising = d.advertising || 0.0;
    const capex = d.capex || 0.0;
    costs += holding + upkeepCost + C.PRODUCT_FIXED * pk.fixed + rd + rdProcess + advertising + capex;

    const sold = d._soldCapacity || 0.0;
    if (sold > 0) revenue += sold * C.CAPEX_PER_UNIT * C.CAPACITY_RESALE;
    if (rd > 0) {
      const dq = C.RD_K * pk.rdLeverage * Math.sqrt(rd / 1000.0) * (100.0 / Math.max(p.quality, 1));
      p.rdPipeline.push({ lands: roundNo + C.RD_DELAY + pk.rdDelay, dq, spend: rd });
    }
    if (rdProcess > 0) {
      const de = C.RD_K_PROC * Math.sqrt(rdProcess / 1000.0)
               * (100.0 / Math.max(p.efficiency, 1));
      p.procPipeline.push({ lands: roundNo + C.RD_DELAY + pk.rdDelay, de, spend: rdProcess });
    }
    if (capex > 0) p.pendingCapacity += capex / C.CAPEX_PER_UNIT;

    p.age += 1;
    const pprofit = sales * d.price - cogs - holding - upkeepCost
                  - C.PRODUCT_FIXED * pk.fixed - rd - rdProcess - advertising;
    p.profitHistory.push(pprofit);
    log.push({
      name: p.name, demand, sales, produced: d._produced,
      inventory: p.inventory, profit: pprofit, stockout: p.stockoutLast,
      revenue: sales * d.price, cogs, holding, upkeepCost, rd, capex,
      unitCost: unitCosts[p.name], lostSales: Math.max(0, demand - available),
    });
  }

  const corp = C.CORP_FIXED * Math.pow(Math.max(1, liveList.length), C.CORP_SCALING);
  costs += corp;
  /* Priced on last round's standing, not this one's — you borrow at the rate you
     had earned, and the consequences of a bad round land the round after. */
  const rate = creditRate(firm, o.creditLimit);
  const interest = firm.debt * rate;
  costs += interest;
  const profit = revenue - costs;
  firm.profitHistory.push(profit);
  if (firm.profitHistory.length > 8) firm.profitHistory.shift();
  firm.cash += profit;
  if (firm.cash < 0) {
    firm.debt += -firm.cash;
    firm.cash = 0.0;
  } else if (firm.debt > 0) {
    const pay = Math.min(firm.cash, firm.debt);
    firm.debt -= pay;
    firm.cash -= pay;
  }
  /* Live sessions let the host pick a difficulty preset, which moves the credit
     limit. Defaults to the balanced constant when nothing is passed. */
  const creditLimit = o.creditLimit === undefined ? C.CREDIT_LIMIT : o.creditLimit;
  if (firm.debt > creditLimit) firm.bankrupt = true;
  return { profit, log, corp, interest, rate, revenue, costs };
}

function companyValue(firm) {
  let v = firm.cash - firm.debt;
  for (const p of firm.products) {
    v += p.invBook * C.SALVAGE;
    if (p.alive && p.profitHistory.length) {
      const recent = p.profitHistory.slice(-3);
      const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
      if (avg > 0) v += 4 * avg;
    }
  }
  return v;
}



/* ==================== shock deck (Level 2) ====================

   reliable, so this deliberately does not forecast. */

const SHOCKS = {

  ],
  cost: [
    { name: 'Input cost spike', mult: 1.35, dur: 2,
      start: 'Component prices jump after a supplier fire',
      during: 'Input costs are up sharply — every unit is dearer to make',
      end: 'Component prices settle back down' },
    { name: 'Tariffs', mult: 1.20, dur: 3,
      start: 'New tariffs announced on imported parts',
      during: 'Tariffs in force — parts cost more',
      end: 'Tariffs lifted after trade talks' },
    { name: 'Commodity glut', mult: 0.85, dur: 2,
      start: 'Oversupply sends raw material prices tumbling',
      during: 'Cheap materials — your units cost less to build',
      end: 'Material prices normalise' },
  ],
  capacity: [
    { name: 'Supply crunch', mult: 0.65, dur: 2,
      start: 'Port strike halts inbound shipments',
      during: 'Supply crunch — you cannot run the factory at full tilt',
      end: 'The ports reopen' },
    { name: 'Logistics strike', mult: 0.75, dur: 2,
      start: 'Hauliers walk out over pay',
      during: 'Haulage disrupted — output is constrained',
      end: 'Hauliers return to work' },
  ],
};
const SHOCK_CHANCE = { demand: 0.20, cost: 0.16, capacity: 0.12 };
const TECH_LEAP_CHANCE = 0.08;
const TECH_LEAP_HIT = 0.88;

/* Small seeded PRNG so a game can be replayed from its seed. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* The shock stream has to survive being written to storage and read back in a
   different process, so the state is a seed and a call count rather than a live
   generator — JSON cannot hold a closure. Rebuilding costs one cheap loop and the
   count stays in the low hundreds over a whole game. */
function newShockState(seed) {
  return { seed: seed >>> 0, calls: 0, active: {}, news: [] };
}

function shockRand(S) {
  if (typeof S.rand !== 'function' || S.at !== S.calls) {
    const r = mulberry32(S.seed);
    for (let i = 0; i < S.calls; i++) r();
    S.rand = r;
  }
  const v = S.rand();
  S.calls += 1;
  S.at = S.calls;
  return v;
}

/* Called at the top of each round, before the player decides. */
/* `firms` may be one firm or many. A technology leap raises the bar for everyone
   in the market — passing a single firm made it hit that company alone, which in
   a shared market means one player is randomly punished and the rest are not. */
function shockTick(S, firms) {
  S.news = [];
  for (const track of Object.keys(SHOCKS)) {
    const cur = S.active[track];
    if (cur && cur.left > 1) {
      cur.left -= 1;
      S.news.push({ kind: 'during', track, text: cur.card.during, card: cur.card });
    } else if (cur) {
      S.news.push({ kind: 'end', track, text: cur.card.end, card: cur.card });
      delete S.active[track];
    } else if (shockRand(S) < SHOCK_CHANCE[track]) {
      const deck = SHOCKS[track];
      const card = deck[Math.floor(shockRand(S) * deck.length)];
      S.active[track] = { card, left: card.dur };
      S.news.push({ kind: 'start', track, text: card.start, card });
    }
  }
  const hit = Array.isArray(firms) ? firms : (firms ? [firms] : []);
  if (shockRand(S) < TECH_LEAP_CHANCE && hit.length) {
    for (const f of hit) for (const p of live(f)) p.quality *= TECH_LEAP_HIT;
    S.news.push({ kind: 'start', track: 'tech',
      text: 'A new generation of products arrives — the bar for "good" just rose',
      card: { name: 'Technology leap' } });
  }
  return S.news;
}

const shockMult = (S, track) => (S.active[track] ? S.active[track].card.mult : 1.0);



/* ==================== bot opponents (Level 3) ====================
   Personalities are the five configurations measured in simulation. They are
   fixed rather than adaptive: the balance numbers were obtained with these

    priceRatio: 1.04, produceRatio: 1.05, rdTotal: 68000, procShare: 0.05, headroom: 1.00, ad: 9000 },
  { id: 'marketer', name: 'Brightwell', tagline: 'You have heard of them',

/* ---------------- seating: labelled vs hidden ----------------
   The behaviour layer below removes the tells a player could measure. This layer
   removes the ones they could simply read. In a labelled game the personalities
   are the teaching material and keep their names and taglines. In a hidden game
   a tagline is a perfect identity leak — "Cheap and everywhere" is a confession —
   so names come from the same pool human players draw from, taglines vanish, and
   the personalities are shuffled so seat order carries no information either. */

const NAME_POOL = [
  'Northgate', 'Aster Industries', 'Bellweather', 'Corvid Manufacturing', 'Dunmore & Sons',
  'Elder Row', 'Fairhaven Works', 'Granby Supply', 'Halloway', 'Ironvale',
  'Juniper Trading', 'Kepler Goods', 'Larkfield', 'Mercer Brothers', 'Nine Elms',
  'Osprey Works', 'Pemberton', 'Quarry Lane', 'Redhill Manufacturing', 'Stanmore',
  'Thackeray', 'Uplands Co', 'Vance & Hart', 'Westmere', 'Yarrow Industries',
];

function shuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Returns the rival seats for a game: which personality sits where, what it is
   called, and what — if anything — the player is told about it. */
function seatRivals(seed, n, hidden) {
  const rnd = mulberry32(seed ^ 0x5eaf1);
  const count = Math.max(1, Math.min(n, BOTS.length));
  const picked = hidden ? shuffle(BOTS, rnd).slice(0, count) : BOTS.slice(0, count);
  const names = hidden ? shuffle(NAME_POOL, rnd) : null;
  return picked.map((bot, i) => ({
    bot,
    label: hidden ? names[i] : bot.name,
    tagline: hidden ? '' : bot.tagline,
    blurb: hidden ? '' : bot.blurb,
    isBot: true,
  }));
}

/* ---------------- making a bot hard to spot ----------------
   A player only ever sees a rival's price, quality and share — so price is where
   essentially all the detection risk lives. The giveaway was never that a bot's
   price stayed still (it moves, because value moves); it was the DECIMALS. A fixed
   ratio times a computed value emits $106.59 every round forever. People type $105. */

function newBotState(seed, bot) {
  return { rand: mulberry32(seed), drift: 0, lastShare: null,
           lastStockout: false, mistakeCd: 0, anchor: bot.priceRatio };
}

const snapTo = (x, step) => Math.round(x / step) * step;

/* A per-round variant of the personality — never a different personality. */
function humaniseBot(bot, st) {
  const rnd = st.rand;
  const u = (a, b) => a + rnd() * (b - a);
  // a slow, mean-reverting wander: nobody re-derives the same number every quarter
  st.drift += u(-0.026, 0.026);
  st.drift *= 0.84;
  // and reactions to what just happened
  if (st.lastShare !== null) {
    if (st.lastShare < 0.14) st.drift -= 0.012;        // losing badly: shade down
    else if (st.lastShare > 0.34) st.drift += 0.008;   // comfortable: take margin
  }
  if (st.lastStockout) st.drift += 0.010;              // could not supply: ease off
  st.drift = Math.max(-0.07, Math.min(0.07, st.drift));

  const out = Object.assign({}, bot);
  out.priceRatio = st.anchor + st.drift;
  out.rdTotal = Math.max(0, snapTo(bot.rdTotal * (1 + u(-0.14, 0.14)), 5000));
  out.ad = Math.max(0, snapTo(bot.ad * (1 + u(-0.18, 0.18)), 1000));
  out.produceRatio = bot.produceRatio * (1 + u(-0.05, 0.05));
  out.headroom = bot.headroom * (1 + u(-0.04, 0.04));
  out.procShare = Math.min(0.6, Math.max(0, bot.procShare + u(-0.05, 0.05)));

  // real mistakes, occasionally, with a cooldown so they do not cluster
  st.mistakeCd = Math.max(0, st.mistakeCd - 1);
  if (st.mistakeCd === 0 && rnd() < 0.09) {
    st.mistakeCd = 3;
    const kind = Math.floor(rnd() * 4);
    if (kind === 0) out.produceRatio *= 1.35;             // over-ordered
    else if (kind === 1) out.rdTotal = 0;                 // skipped research
    else if (kind === 2) out.ad = snapTo(bot.ad * 2.2, 1000);  // panic-bought attention
    else out.headroom *= 1.45;                            // overbuilt the factory
  }
  return out;
}

/* People post round prices. This is the single most visible tell. */
function humanPrice(val, ratio, rnd) {
  const raw = val * ratio;
  const roll = rnd();
  if (roll < 0.30) return Math.round(raw / 5) * 5;
  if (roll < 0.80) return Math.round(raw);
  return Math.round(raw * 2) / 2;
}

function botObserve(st, share, stockout) {
  st.lastShare = share;
  st.lastStockout = stockout;
}

/* What any firm can honestly work out before a round resolves: its own share if
   every rival repeats the price it charged last round. The bots get exactly the
   same information the human player does — nobody sees this round's prices. */
function estimateShare(me, myPrice, rivals, rivalLastPrices, marketMult) {
  const entries = [{ product: me, price: myPrice }].concat(
    rivals.map((rp, k) => ({ product: rp, price: rivalLastPrices[k] })));
  return sharedDemands(entries, marketMult).demands[0];
}

/* Per product, so a bot running two lines splits its money across them instead of
   spending its whole budget twice. */
function botDecideFor(firm, bot, p, guess, opts) {
  const o = opts || {};
  const cm = o.capacityMult === undefined ? 1 : o.capacityMult;
  const share = o.budgetShare === undefined ? 1 : o.budgetShare;
  const price = value(p) * bot.priceRatio;
  let budget = firm.cash * 0.55 * share;
  let capex = 0, sellCapacity = 0;
  const target = guess * bot.headroom;
  if (target > effCapacity(p) * 0.95) {
    capex = Math.min(Math.max(0, target - effCapacity(p)) * C.CAPEX_PER_UNIT, budget * 0.45);
    budget -= capex;
  } else if (p.age >= C.MATURITY_ROUND && effCapacity(p) > target * 1.3) {
    sellCapacity = p.capacity - target * 1.1;   // only shed plant in real decline
  }
  const advertising = Math.min(bot.ad, Math.max(0, budget)); budget -= advertising;
  const rd = Math.min(bot.rdTotal * (1 - bot.procShare), Math.max(0, budget)); budget -= rd;
  const rdProcess = Math.min(bot.rdTotal * bot.procShare, Math.max(0, budget)); budget -= rdProcess;
  const produce = Math.max(0, Math.min(guess * bot.produceRatio, effCapacity(p) * cm) - p.inventory);
  return { price, produce, rd, rdProcess, advertising, capex, sellCapacity };
}

function botDecide(firm, bot, guess, opts) {
  return botDecideFor(firm, bot, live(firm)[0], guess, opts);
}

/* A new product line for an existing company, carrying over what the company
   already knows how to do. */
function newLine(firm, name, kind) {
  const p = newProduct(name, kind);
  const best = live(firm).reduce((a, x) => Math.max(a, x.quality), 0);
  const eff = live(firm).reduce((a, x) => Math.max(a, x.efficiency), 0);
  /* Know-how carries over in full only when the new line is the same sort of
     thing. A factory's process learning is worth much less to a software product,
     and vice versa — which is what stops "launch a different kind" being a free
     reset into whichever kind is currently strongest. */
  const same = live(firm).some((x) => (x.kind || 'hardware') === (p.kind || 'hardware'));
  const carry = same ? 1 : 0.6;
  if (best > 0) p.quality = Math.max(p.quality, best * C.LINE_QUALITY_INHERIT * carry);
  if (eff > 0) p.efficiency = Math.max(p.efficiency, eff * C.LINE_EFFICIENCY_INHERIT * carry);
  return p;
}

/* Whether a bot opens a second line. Without this, long live games are decided by
   the fact that only the humans can answer a product going into decline — which
   would be a worse asymmetry than the one it fixes. The rules are the ones a
   cautious operator would use: pay cash, never while in debt, only once the
   existing line is maturing, and never so late that it cannot pay back. */
function botShouldLaunch(firm, roundNo, totalRounds, rnd, creditLimit) {
  const ps = live(firm);
  if (!ps.length || ps.length >= C.MAX_PRODUCTS) return false;
  /* Bots will borrow for a launch, but only a third of their remaining line —
     they are meant to be plausible operators, not reckless ones. */
  const headroom = Math.max(0, (creditLimit === undefined ? C.CREDIT_LIMIT : creditLimit) - firm.debt);
  if (firm.cash + headroom - C.LAUNCH_COST < C.LAUNCH_RESERVE) return false;
  if (totalRounds - roundNo < 5) return false;
  const oldest = ps.reduce((a, p) => Math.max(a, p.age), 0);
  if (oldest < C.MATURITY_ROUND - 3) return false;
  return rnd() < 0.5;
}




/* The same economy the server runs, in the page — so the projection below is
   computed with the identical code that will resolve the round, not an
   approximation of it. That is the whole reason it can be trusted. */

const $ = (id) => document.getElementById(id);

const DEMOKEY = 'ceo.demo.v1';

/* Signing in is only needed to host or to own a name. Joining a game a friend
   sent you stays anonymous — the invitation is the credential. */
async function api(path, body) {
  const headers = {};
  if (body) headers['content-type'] = 'application/json';
  if (S.session && S.session.access_token) headers.authorization = `Bearer ${S.session.access_token}`;
  const opt = body ? { method: 'POST', headers, body: JSON.stringify(body) } : { headers };
  const res = await fetch('/api/' + path, opt);
  const data = await res.json().catch(() => ({ error: 'The server sent something unreadable.' }));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;

function setBusy(b) { S.busy = b; render(); }
async function guard(fn) {
  S.error = null; setBusy(true);
  try { await fn(); } catch (e) { S.error = e.message; }
  setBusy(false);
}

/* --------------------------------------------------------------- accounts */
async function initAuth() {
  const cfg = S.cfg && S.cfg.auth;
  if (!cfg || !cfg.enabled) {
    /* Running locally against the in-memory server: no Supabase, so a token can
       be typed in. Never reachable in production, where auth.enabled is true. */
    const dev = localStorage.getItem('ceo.dev.token');
    if (dev) S.session = { access_token: dev };
    return;
  }
  try {
    const mod = await import('https://esm.sh/@supabase/supabase-js@2');
    S.sb = mod.createClient(cfg.url, cfg.anonKey, {
      auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
    });
    const { data } = await S.sb.auth.getSession();
    S.session = data.session || null;
    S.sb.auth.onAuthStateChange((_e, sess) => {
      S.session = sess || null;
      loadAccount().then(render);
    });
  } catch (e) {
    S.error = 'Could not load sign-in. ' + e.message;
  }
}

async function loadAccount() {
  try { S.account = await api('account'); } catch { S.account = { signedIn: false }; }
}

async function signIn(email) {
  if (!S.sb) throw new Error('Sign-in is not configured on this server.');
  const { error } = await S.sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + '/g/' },
  });
  if (error) throw new Error(error.message);
  S.notice = `Check ${email} — we have sent you a sign-in link.`;
}

async function signOut() {
  if (S.sb) await S.sb.auth.signOut();
  S.session = null; S.account = null;
}

        <td class="v"><span class="pill">AI company if nobody takes it</span></td></tr>`).join('')}
    </tbody></table>
    <p class="muted" style="margin-top:12px">${v.seatCount} companies · ${v.totalRounds} rounds ·
      a round every ${esc((v.cadenceLabel || 'day').toLowerCase())}${v.cadenceMinutes >= 1440
        ? `, closing at ${String(v.closeHour).padStart(2, '0')}:00 UTC` : ''} ·
      ${esc(v.preset)} difficulty${v.cadenceMinutes < 1440
        ? ` · about ${Math.round(v.totalRounds * v.cadenceMinutes / 60) || '<1'} hours end to end`
        : ''}</p>
    ${v.isPublic
      ? `<p class="muted" style="margin-top:6px">Starting automatically — hold tight.</p>`
      : v.isHost
        ? `<button class="primary" id="start" style="margin-top:6px">Start the game${waiting ? ` (${waiting} seat${waiting > 1 ? 's' : ''} become AI)` : ''}</button>`
        : `<p class="muted" style="margin-top:6px">The host starts the game when everyone is in.</p>`}
  </div>`;
}

/* ----------------------------------------------------------------- playing */
/* At a day the seconds are noise; at five minutes they are the whole tension. */
function countdown(iso) {
  if (!iso) return '';
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'closing now';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h >= 1) return `closes in ${h}h ${m}m`;
  if (m >= 5) return `closes in ${m}m`;
  return `closes in ${m}:${String(sec).padStart(2, '0')}`;
}

/* How urgent the clock is, for the header and how hard we poll. */
const isFast = () => S.view && S.view.cadenceMinutes && S.view.cadenceMinutes <= 60;

function marketTable(v) {
  return `<table>
    <thead><tr><th>Company</th><th class="v">Last price</th><th class="v">Quality</th><th class="v">Lines</th>

    <tbody>${v.market.map((m) => `

          <div class="bar"><i style="width:${((m.lastShare || 0) * 100).toFixed(0)}%"></i></div></td>
        <td class="v">${m.out ? '—' : money2(m.lastPrice || 0)}</td>
        <td class="v">${m.out ? '—' : (m.quality || 0).toFixed(0)}</td>
        <td class="v">${m.out ? '—' : (m.lineCount > 1 ? m.lineCount + ' lines' : '1')}</td>
        <td class="v">${m.out ? '—' : pct(m.lastShare)}</td>
        <td class="v">${m.out ? '<span class="pill dead">out of business</span>'

function creditCard(y) {

  const tone = c.rate < 0.055 ? 'in' : c.rate < 0.115 ? '' : c.rate < 0.16 ? 'out' : 'dead';
  return `

      <h2 style="margin:0">Borrowing</h2>

    </div>

      <tr><td>Cash</td><td class="v">${money(y.cash)}</td></tr>
      <tr><td>Owed</td><td class="v ${c.drawn > 0 ? 'neg' : ''}">${money(c.drawn)}</td></tr>
      <tr><td>Still available to borrow</td><td class="v">${money(c.headroom)}</td></tr>
      ${c.drawn > 0 ? `<tr><td>Interest this round</td><td class="v neg">${money(-c.costPerRound)}</td></tr>` : ''}
      <tr class="total"><td>The bank calls it in past</td><td class="v">${money(c.limit)}</td></tr>
    </tbody></table>
