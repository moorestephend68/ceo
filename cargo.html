<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cargo Run</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#121a28; --panel2:#0e1522; --line:#22304a;
    --ink:#e6edf7; --dim:#8296b4; --dimmer:#5a6d8c;
    --gold:#f2c14e; --good:#5fd08a; --bad:#ff7a6b; --blue:#5aa9ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.45 ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:0 16px 150px;overflow-x:hidden}
  .wrap{max-width:560px;margin:0 auto}
  header{padding:18px 0 10px}
  h1{font-size:19px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .bar{display:flex;gap:8px;margin:12px 0 4px;font-size:12px;color:var(--dim)}
  .bar b{color:var(--ink);font-weight:600;display:block}
  .bar div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  svg{display:block;width:100%;height:auto;background:var(--panel2);
      border:1px solid var(--line);border-radius:12px;margin:12px 0}
  .step{margin:18px 0 0}
  .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);margin-bottom:7px}
  .lab .n{color:var(--gold)}
  .opts{display:flex;flex-direction:column;gap:6px}
  button.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font:inherit;text-align:left;padding:8px 12px;cursor:pointer}
  button.opt[aria-pressed=true]{border-color:var(--gold);background:#1b2233}
  .opt .nm{flex:1;min-width:0;font-size:15px}
  button.opt.tall{min-height:62px}
  .opt .meta{font-size:12px;color:var(--dim)}
  .opt .px{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
  .muted{color:var(--dimmer)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button.opt{width:auto;flex:1 1 46%;min-height:58px}
  .dock{position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg,rgba(10,14,23,0) 0%,var(--bg) 22%);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:560px;margin:0 auto}
  .fc{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
  .fc small{color:var(--dim);font-size:12px}
  .fc .v{font-size:19px;font-variant-numeric:tabular-nums;font-weight:600}
  button.go{width:100%;min-height:56px;border-radius:12px;border:0;font:inherit;font-size:16px;
    font-weight:600;background:var(--gold);color:#17120a;cursor:pointer;letter-spacing:.02em}
  button.go[disabled]{background:#243046;color:var(--dimmer);cursor:default}
  button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .card h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
    margin:0 0 10px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:6px 4px;text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--dimmer);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  td:first-child,th:first-child{text-align:left;font-variant-numeric:normal}
  tr.you td{color:var(--gold)}
  .g{color:var(--good)} .b{color:var(--bad)}
  .note{font-size:13px;color:var(--dim);line-height:1.55}
  .big{font-size:30px;font-variant-numeric:tabular-nums;font-weight:600;margin:2px 0 6px}
  input[type=range]{width:100%;height:40px;accent-color:var(--gold)}
  input[type=text]{width:100%;min-height:52px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;padding:0 12px;letter-spacing:.08em}
  .err{color:var(--bad);font-size:13px;margin:8px 2px 0}

  /* the resolution film sits over everything while it runs */
  #film{position:fixed;inset:0;z-index:50;background:#070b12}
  #film canvas{display:block;width:100%;height:100%}
  #film #skip{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);
    background:rgba(18,26,40,.9);color:var(--ink);font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<p id="build" style="text-align:center;font-size:11px;color:#5a6d8c;margin:22px 0 0"></p>
<div class="dock" id="dock"></div>

<!-- The resolution, watched rather than read. Hidden until a round closes. -->
<div id="film" hidden>
  <canvas id="reel"></canvas>
  <button id="skip">Skip</button>
</div>

<script>
/* CARGO RUN — the live page.

   The engine is on the server and this page never simulates anything: it draws
   what the API says and files what the captain chooses. That is deliberate.
   The single-player page carries its own copy of the economy, which is fine for
   one person against bots and would be a disaster here — a client that can
   compute the round is a client that can be asked to compute it differently.

   A round is two windows, and the reason is measured: your hold is published
   between them but your destination is not. Publishing the destination too let
   the sharp players route around the naive ones perfectly; publishing nothing
   left the first round a coin flip. Your refit bids ride along with the first
   window, so the yard costs no extra waiting.  */

const KEY = 'cargo.game';
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const money = (v) => (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString();
const px = (v) => '$' + Number(v).toFixed(2);
const cls = (v) => v < 0 ? 'b' : 'g';
const GOODS = ['Ore','Grain','Fuel Cells','Medicine','Alloys'];
const SLOTNAMES = ['Coolant Loop','Drive Coil','Hull Plate','Nav Unit','Power Cell','Thrust Bearing'];
const CONDITION = (g) => g>=0.88?'factory-sealed' : g>=0.72?'reconditioned'
                       : g>=0.55?'serviceable' : g>=0.40?'well-used' : 'salvage';

let S = { code: null, token: null, view: null, sel: {}, bids: [], store: 0, collect: 0, busy: false, error: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ code: S.code, token: S.token })); } catch {} };
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };

/* Signing in is CEO's, not this page's. Hosting a private table is the thing
   that was bought, so the server checks it — which means this page has to send
   whatever session the site already has. Supabase keeps it under a key of its
   own; locally there is no Supabase and a token can be dropped into
   ceo.dev.token instead, exactly as live.html does. */
function bearer() {
  try {
    const dev = localStorage.getItem('ceo.dev.token');
    if (dev) return dev;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!/^sb-.*-auth-token$/.test(k)) continue;
      const v = JSON.parse(localStorage.getItem(k));
      if (v && v.access_token) return v.access_token;
    }
  } catch {}
  return null;
}

async function api(route, body) {
  const url = '/api/' + route + (S.code ? (route.includes('?') ? '&' : '?') + 'code=' + S.code
    + (S.token ? '&token=' + S.token : '') : '');
  const headers = {};
  const tok = bearer();
  if (tok) headers.authorization = 'Bearer ' + tok;
  if (body) headers['content-type'] = 'application/json';
  const r = await fetch(url, body ? { method: 'POST', headers, body: JSON.stringify(body) }
                                  : { headers });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || 'Something went wrong.');
  return out;
}

/* Polling, not sockets. A round closes when the last captain files or when the
   clock runs out, and either way the next request notices — so the page only
   has to ask. Slow while it is your move, brisk while you are waiting on
   somebody else, and stopped when the tab is hidden. */
let timer = null;
let pollFails = 0;
function poll(ms) {
  clearTimeout(timer);
  if (document.hidden) return;
  timer = setTimeout(async () => {
    try {
      const out = await api('cargo/view');
      pollFails = 0;
      if (S.error) { S.error = null; }
      applyView(out.view);
    } catch (e) {
      /* A swallowed poll is a page that just stops. That is exactly what
         happened when the server started refusing writes: the countdown
         reached two seconds, froze, and said nothing — the one failure mode
         where the captain cannot even tell you what went wrong. One blip is
         noise, three in a row is news. */
      if (++pollFails >= 3) { S.error = e.message; render(); }
    }
    poll(ms);
  }, ms);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

/* Every view arrives here. If it carries a round nobody has watched yet, the
   film plays and the screen underneath is drawn when it finishes — so the
   resolution is the default and the table is one tap away, rather than a
   twelve-second cutscene standing between a captain and their next decision. */
function applyView(v) {
  S.view = v;
  if (maybePlayFilm(v)) return;
  render();
}

async function refresh() {
  if (!S.code) return render();
  try { const out = await api('cargo/view'); return applyView(out.view); }
  catch (e) { S.error = e.message; }
  render();
}

/* ------------------------------------------------------------------ screens */
function render() {
  const app = document.getElementById('app'), dock = document.getElementById('dock');
  app.innerHTML = ''; dock.innerHTML = '';
  const v = S.view;
  if (!S.code || !v) return screenHome(app, dock);
  if (v.status === 'lobby') return screenLobby(app, dock, v);
  if (v.status === 'over') return screenOver(app, dock, v);
  if (v.stage === 'declare') return screenDeclare(app, dock, v);
  return screenRoute(app, dock, v);
}

function head(v) {
  const you = v.seats.find((s) => s.you) || {};
  const rank = [...v.seats].sort((a, b) => b.cash - a.cash).findIndex((s) => s.you) + 1;
  const left = v.deadline ? Math.max(0, Math.round((Date.parse(v.deadline) - Date.now()) / 1000)) : null;
  const clock = left === null ? 'no clock'
    : left > 90 ? Math.round(left / 60) + ' min left'
    : left + 's left';
  return `<header><h1>Cargo Run</h1>
    <div class="sub">${v.stage === 'declare' ? 'Manifests close' : 'Stations close'} · ${clock}</div>
    <div class="bar">
      <div>Round<b>${Math.min(v.round, v.rounds)} of ${v.rounds}</b></div>
      <div>Cash<b>${money(you.cash || 0)}</b></div>
      <div>Hold<b>${you.hold || 0}</b></div>
      <div>Place<b>${rank} of ${v.seats.length}</b></div>
    </div></header>`;
}

function screenHome(app, dock) {
  app.insertAdjacentHTML('beforeend', `<header><h1>Cargo Run</h1>
    <div class="sub">Five captains, one galaxy, eight runs</div></header>
    <div class="card"><p class="note">Every round opens in the yard: a part of your ship has
    failed and four replacements go under the hammer, one sealed bid each. Then you load,
    everybody's manifest is published, and you choose where to sell — knowing what the others
    are carrying but not where they are taking it.</p></div>`);
  if (S.error) app.insertAdjacentHTML('beforeend', `<p class="err">${S.error}</p>`);

  const n = $(`<div class="step"><div class="lab">Your outfit</div>
    <input type="text" id="name" maxlength="24" placeholder="Halloran Freight"
      value="${(S.name || '').replace(/"/g, '&quot;')}" style="letter-spacing:0"></div>`);
  app.appendChild(n);

  const c = $(`<div class="step"><div class="opts"></div></div>`);
  const now = $(`<button class="opt tall"><span class="nm">Play now
    <br><span class="meta">Seated with strangers. Starts within 90 seconds — empty seats
    are filled.</span></span></button>`);
  now.onclick = () => start('cargo/public/join');
  const friends = $(`<button class="opt tall"><span class="nm">Play with friends
    <br><span class="meta">Opens a private table and gives you a code to pass round.</span></span></button>`);
  friends.onclick = () => start('cargo/create');
  c.querySelector('.opts').append(now, friends);
  app.appendChild(c);

  const j = $(`<div class="step"><div class="lab">Or join with a code</div>
    <input type="text" id="code" placeholder="ABC123" autocapitalize="characters" maxlength="6">
    </div>`);
  app.appendChild(j);
  const d = $(`<div class="inner"><button class="go ghost">Join that table</button></div>`);
  d.querySelector('.go').onclick = () => {
    const code = (document.getElementById('code').value || '').trim().toUpperCase();
    if (code.length < 4) { S.error = 'That code looks too short.'; return render(); }
    S.code = code; start('cargo/join');
  };
  dock.appendChild(d);
}

async function start(route) {
  if (S.busy) return;
  const field = document.getElementById('name');
  const name = ((field && field.value) || S.name || '').trim();
  if (!name) { S.error = 'Your outfit needs a name.'; return render(); }
  S.name = name; S.busy = true; S.error = null; render();
  try {
    const out = await api(route, { name });
    S.code = out.code; S.token = out.token; S.view = out.view; save();
    poll(3000);
  } catch (e) { S.error = e.message; S.code = null; }
  S.busy = false; render();
}

function screenLobby(app, dock, v) {
  app.insertAdjacentHTML('beforeend', `<header><h1>Cargo Run</h1>
    <div class="sub">Table ${v.code}</div></header>`);
  let t = `<div class="card"><h2>At the table</h2><table>`;
  v.seats.forEach((s) => { t += `<tr class="${s.you ? 'you' : ''}"><td>${s.name}</td>
    <td class="muted">${s.you ? 'you' : 'ready'}</td></tr>`; });
  for (let i = v.seats.length; i < (v.seats.length > 5 ? v.seats.length : 5); i++)
    t += `<tr><td class="muted">empty</td><td class="muted">—</td></tr>`;
  app.insertAdjacentHTML('beforeend', t + '</table></div>');
  if (v.isPublic) {
    /* No code here on purpose. A public table is dealt by matchmaking and the
       server refuses a code join — the rated tier rests on nobody choosing who
       they sit with. Offering a code would be inviting a captain to try
       something that cannot work. */
    const left = v.lobbyDeadline
      ? Math.max(0, Math.round((Date.parse(v.lobbyDeadline) - Date.now()) / 1000)) : null;
    app.insertAdjacentHTML('beforeend', `<div class="card"><h2>Waiting</h2>
      <div class="big">${left === null ? '—' : left + 's'}</div>
      <p class="note">Other captains are being seated here as they arrive. When the wait runs
      out the table starts anyway and the yard's own captains take whatever seats are left —
      nobody is told which.</p></div>`);
    const d = $(`<div class="inner"><div class="fc"><small>Table ${v.code}</small>
      <span class="v muted">${v.seats.length} of ${v.seats.length > 5 ? v.seats.length : 5}</span></div>
      <button class="go" disabled>Waiting for the off</button></div>`);
    dock.appendChild(d);
  } else {
    app.insertAdjacentHTML('beforeend', `<div class="card"><h2>The code</h2>
      <div class="big">${v.code}</div>
      <p class="note">Anyone with this can take a seat. Start when you are all here — any
      seats still empty are taken by the yard's own captains, and nobody is told which.</p></div>`);
    const d = $(`<div class="inner"><button class="go">Start now</button></div>`);
    d.querySelector('.go').onclick = async () => {
      try { const out = await api('cargo/start', {}); S.view = out.view; render(); }
      catch (e) { S.error = e.message; render(); }
    };
    dock.appendChild(d);
  }
  poll(2500);
}

/* map: reachable spots, the lane you are flying, and where it can sell */
function mapSVG(v) {
  const b = v.board, you = v.you, sel = S.sel;
  const reach = new Set(b.reachP[you.at]);
  let g = '';
  if (sel.p !== undefined) {
    const a = b.drop[you.at], p = b.pick[sel.p];
    g += `<line x1="${a.x}" y1="${a.y}" x2="${p.x}" y2="${p.y}" stroke="#f2c14e" stroke-width="0.7" stroke-dasharray="2 1.5"/>`;
    for (const q of b.reachD[sel.p]) { const c = b.drop[q];
      g += `<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}" stroke="#5fd08a" stroke-width="0.4" opacity="0.55"/>`; }
    if (sel.d !== undefined) { const c = b.drop[sel.d];
      g += `<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}" stroke="#f2c14e" stroke-width="0.9"/>`; }
  }
  b.pick.forEach((p) => { const on = reach.has(p.i), pick = sel.p === p.i;
    g += `<circle cx="${p.x}" cy="${p.y}" r="${pick?2.4:1.5}" fill="${pick?'#f2c14e':on?'#5aa9ff':'#2b3a55'}"/>`; });
  b.drop.forEach((d) => { const home = you.at === d.i, s = sel.d === d.i;
    g += `<rect x="${d.x-2.2}" y="${d.y-2.2}" width="4.4" height="4.4" rx="0.8"
      fill="${s?'#f2c14e':home?'#e6edf7':'#2b3a55'}"/>`;
    g += `<text x="${d.x}" y="${d.y-3.4}" font-size="3" text-anchor="middle"
      fill="${s||home?'#e6edf7':'#5a6d8c'}">${d.name.split(' ')[0]}</text>`; });
  return `<svg viewBox="0 0 100 100" role="img" aria-label="galaxy map">${g}</svg>`;
}

function lastRoundCard(v) {
  const h = (v.history || [])[0];
  if (!h) return '';
  const me = v.seats.findIndex((s) => s.you);
  const mine = h.rows[me];
  const r = v.you.lastRefit;
  let s = `<div class="card"><h2>Last round</h2>
    <div class="big ${cls(mine.profit)}">${money(mine.profit)}</div>
    <p class="note">${GOODS[mine.c]} into ${v.board.drop[mine.d].name} —
    ${mine.stackS > 1 ? `<b class="b">${mine.stackS} ships</b> sold there` : 'you had it to yourself'}.</p>`;
  if (r) s += `<p class="note">${r.lot === null
    ? `Outbid on every part. The yard fitted a scrap ${SLOTNAMES[r.slot]} for nothing.`
    : `You took a ${CONDITION(r.grade)} ${SLOTNAMES[r.slot]} at ${Math.round(100*r.grade)}%${
        r.paid > 0 ? ' for ' + money(r.paid) : ' for nothing'}.`}</p>`;

  /* WHAT THE SHEDS DID. Without this the mechanic is invisible: a captain
     keeps a warehouse, somebody empties half of it, and the only evidence is
     a cash balance that moved for no stated reason. Both directions get said —
     what your pile earned, and how much of what YOU bought came out of
     somebody else's, which is the half nobody would otherwise ever learn. */
  if (v.sheds && v.sheds.on) {
    /* somebody bought from a pile of yours */
    let earned = 0, units = 0;
    h.rows.forEach((row) => (row.takings || []).forEach((q) => {
      if (q.owner === me) { earned += q.paid; units += q.units; }
    }));
    if (units > 0) {
      s += `<p class="note" style="color:var(--good)"><b>${units} units</b> went out of your
        shed — another captain loaded them and paid you the going rate at the rock,
        <b>${money(earned)}</b>. They are not told whose they were.</p>`;
    }
    if (mine.fromPiles > 0) {
      s += `<p class="note"><b>${mine.fromPiles}</b> of the ${mine.bought} units you loaded came
        out of somebody's shed. You paid the posted price for them exactly as you would
        at an empty rock — the money went to the captain who left them there instead of
        to the market, and you are not told who that was.</p>`;
    }
    if (mine.collect > 0) {
      s += `<p class="note">You brought <b>${mine.collect}</b> units back out of your own
        shed and carried them yourself.</p>`;
    }
  }
  return s + '</div>';
}

/* ---- YOUR SHEDS -------------------------------------------------------
   Standing, not just after a round that happened to pay. A pile costs rent
   every round whether anybody comes or not, and a captain needs to be able
   to see what they are paying for and where it is. */
function shedCard(v) {
  const sh = v.sheds;
  if (!sh || !sh.on) return '';
  const mine = sh.mine || [];
  if (!mine.length) return '';
  const rent = mine.reduce((a, x) => a + x.units, 0) * sh.rent;
  let t = `<div class="card"><h2>Your sheds</h2><table>
    <tr><th>Where</th><th>What</th><th>Units</th><th>Rent a round</th></tr>`;
  mine.forEach((x) => {
    t += `<tr class="you"><td>${v.board.pick[x.p].name}</td><td>${GOODS[x.c]}</td>
      <td>${x.units}</td><td class="b">−${money(x.units * sh.rent)}</td></tr>`;
  });
  t += `</table><p class="note" style="margin-top:8px">${money(rent)} a round until it moves.
    Any captain who loads that good at that rock takes yours first and pays you the going
    rate for it — and whatever is still here when the season ends is sold back at the
    posted price, so a shed is stock, not a bonfire. What it costs you is the rent and
    the price it fetches in the end.${
      sh.takings ? ` So far this season your sheds have taken <b class="g">${
        money(sh.takings)}</b> against <b class="b">${money(sh.rentPaid)}</b> of rent.` : ''}</p>`;
  if (!sh.canStore) t += `<p class="note">The sheds are shut for the last ${sh.windDown}
    rounds — collect what you can while you still fly past it.</p>`;
  return t + '</div>';
}

/* ---- stage one: the yard and the manifest, filed together ---------------- */
/* ======================================================================
   WHAT THE RUN WOULD PAY

   The one number a captain actually wants while they are choosing, and the
   game has never shown it. It is the same arithmetic the server does when it
   settles — the constants come down in the view rather than being written
   here, so the page cannot quietly start quoting a different economy from the
   one that will pay out.

   THE HONEST PART. Fuel, upkeep and the load are exact: they depend on the
   ship and the board and nothing else. The PRICE is not, because it depends
   on how many other captains pick the same spot and the same station, and
   nobody knows that when they file. So the headline is the lane to yourself,
   and under it what the same run pays once one or two others pile in — which
   on a crowded lane is most of the difference between a good week and a bad
   one, and is exactly the thing a table of prices cannot tell you.
   ====================================================================== */
function projectRun(v, p, c, d) {
  const E = v.econ; if (!E || !v.prices || !v.you) return null;
  const you = v.you, b = v.board;
  const buyMult = (q) => Math.pow((q + E.REF) / (E.LOAD + E.REF), E.ELAS);
  const sellMult = (q) => Math.pow((q + E.REF) / (E.LOAD + E.REF), -E.ELAS);
  const bp = v.prices.buy[p][c];
  const load = Math.max(0, Math.min(you.hold, Math.floor(you.cash / bp)));
  const dd = d === undefined
    ? b.reachD[p].reduce((a, x) => v.prices.sell[x][c] > v.prices.sell[a][c] ? x : a, b.reachD[p][0])
    : d;
  const fuel = E.FUEL * (b.sdist[you.at][p] + b.pdist[p][dd]);
  const seatOf = (name) => (v.seats || []).find((x) => x.name === name) || {};
  /* WHAT IS KNOWN, ONCE THE MANIFESTS ARE OUT. A rival loading at the same
     spot with the same cargo squeezes the BUY price whatever they do next,
     and everything that decides how much they lift — their hold and their
     cash — is on the board. So this half is not a guess at all, and the
     projection should not pretend it is. */
  const sharing = (v.manifests || []).filter((x) => !x.you && x.p === p && x.c === c);
  const lift = (x) => { const st = seatOf(x.name);
    return Math.max(0, Math.min(st.hold || E.LOAD, Math.floor((st.cash || 0) / bp))); };
  const qb = load + sharing.reduce((a, x) => a + lift(x), 0);
  /* WHAT IS NOT. Who else lands where you land. The candidates are public —
     same cargo, and this station within their reach — but the choice is the
     one thing the round keeps hidden until it settles. */
  const risk = (v.manifests || []).filter((x) => !x.you && x.c === c
    && (x.couldSell || []).includes(dd));
  const at = (k) => {
    const qs = load + risk.slice(0, k).reduce((a, x) => a + lift(x), 0);
    return load * (v.prices.sell[dd][c] * sellMult(qs) - bp * buyMult(qb)) - fuel - E.UPKEEP;
  };
  return { load, fuel, d: dd, upkeep: E.UPKEEP,
           sharing: sharing.length, risk: risk.length,
           alone: at(0), one: at(1), all: at(risk.length) };
}

/* THE BEST RUN ON THE BOARD, before a captain has touched anything.

   The projection was written to help somebody choose and then only appeared
   once they had chosen, which is the wrong way round and is exactly how a
   feature ships invisible. So the screen opens with the best run it can find
   for this ship from where it is standing — which is also the honest answer to
   "what is this week worth", and the thing every captain works out by hand in
   their first two rounds anyway. */
function bestRun(v) {
  const you = v.you, b = v.board;
  if (!you || !v.prices || !v.econ) return null;
  let best = null;
  for (const p of b.reachP[you.at]) {
    for (let c = 0; c < 5; c++) {
      const r = projectRun(v, p, c);
      if (r && (!best || r.alone > best.r.alone)) best = { p, c, r };
    }
  }
  return best;
}

function projCard(v, p, c, d, note) {
  const r = projectRun(v, p, c, d);
  if (!r) return '';
  const known = d !== undefined;
  let rows = `<tr><td>Carrying</td><td class="v">${r.load} units</td></tr>
    <tr><td>Fuel and upkeep</td><td class="v b">−${money(Math.round(r.fuel + r.upkeep))}</td></tr>`;
  if (r.sharing) {
    rows += `<tr><td class="muted">${r.sharing === 1 ? 'one other captain is' : r.sharing + ' others are'}
      loading here too</td><td class="v muted">already counted</td></tr>`;
  }
  if (known && r.risk) {
    rows += `<tr><td class="muted">if one of them sells here too</td>
      <td class="v ${cls(r.one)}">${money(Math.round(r.one))}</td></tr>`;
    if (r.risk > 1) rows += `<tr><td class="muted">if all ${r.risk} do</td>
      <td class="v ${cls(r.all)}">${money(Math.round(r.all))}</td></tr>`;
  }
  return `<div class="card"><h2>What this run pays</h2>
    <div class="big ${cls(r.alone)}">${money(Math.round(r.alone))}</div>
    <p class="note" style="margin-top:2px">${
      !known ? (note ? '' : 'selling at the best station posted')
      : r.risk === 0 ? 'and nobody else can land where you are landing'
      : 'if none of the ' + (r.risk === 1 ? 'other carrier lands' : r.risk + ' other carriers land')
        + ' there'}${note ? (known ? ' · ' + note : note + ', selling where it pays most') : ''}</p>
    <table style="margin-top:8px">${rows}</table>
    <p class="note" style="margin-top:8px">${
      r.sharing
        ? 'The buy price already has the ' + (r.sharing === 1 ? 'captain' : r.sharing + ' captains')
          + ' loading alongside you in it — their hold and their cash are on the board, so that '
          + 'part is arithmetic. '
        : 'Fuel, upkeep and the load are exact. '}What nobody can know is who else picks the
      same station: that is the one thing this round keeps hidden until it settles.</p></div>`;
}


function screenDeclare(app, dock, v) {
  const you = v.you, b = v.board;
  app.insertAdjacentHTML('beforeend', head(v));
  if (you.declared) {
    app.insertAdjacentHTML('beforeend', `<div class="card"><h2>Filed</h2>
      <p class="note">${GOODS[you.declared.c]} from ${b.pick[you.declared.p].name}, and your
      bids are in. Waiting for ${v.seats.filter((s) => !s.filed).length} more.</p></div>`);
    app.insertAdjacentHTML('beforeend', lastRoundCard(v));
    app.insertAdjacentHTML('beforeend', shedCard(v));
    poll(3000);
    return;
  }
  app.insertAdjacentHTML('beforeend', lastRoundCard(v));
  app.insertAdjacentHTML('beforeend', shedCard(v));

  /* the yard */
  if (v.block) {
    const failed = v.block.failed;
    if (S.bids.length !== v.block.grades.length) S.bids = v.block.grades.map(() => 0);
    let sh = `<div class="card"><h2>Your ship — ${SLOTNAMES[failed]} has failed</h2><table>`;
    you.parts.forEach((g, k) => {
      sh += `<tr class="${k === failed ? 'you' : ''}"><td>${SLOTNAMES[k]}</td>
        <td class="muted">${k === failed ? '' : CONDITION(g)}</td>
        <td>${k === failed ? '<b>failed</b>' : Math.round(100*g) + '%'}</td></tr>`;
    });
    app.insertAdjacentHTML('beforeend', sh + `</table><p class="note" style="margin-top:8px">
      A unit of hold returns about ${money(v.perUnit)} a round — that is what to judge every
      bid against. The refit settles at the end of this round, out of the same purse you are
      trading with.</p></div>`);

    const step = $(`<div class="step" data-step="block"><div class="lab"><span class="n">1</span>
      &nbsp;Sealed bids — any part fits your ${SLOTNAMES[failed]}</div><div class="opts"></div></div>`);
    v.block.grades.forEach((g, j) => {
      const full = v.block.worth[j];
      const cap = Math.max(100, Math.ceil(full * 1.25 / 25) * 25);
      const row = $(`<div class="card" style="margin:6px 0;padding:11px 12px">
        <div style="display:flex;gap:10px;align-items:baseline">
          <span style="flex:1">Lot ${j+1} · ${CONDITION(g)} <b>${Math.round(100*g)}%</b>
            <br><span class="meta" style="font-size:11.5px">beats
            ${j === v.block.grades.length-1 ? 'a scrap part' : 'Lot ' + (j+2)} by ${money(full)}</span></span>
          <span style="text-align:right"><span class="px" id="bv${j}">—</span>
            <br><span class="meta" id="bu${j}" style="font-size:11.5px">&nbsp;</span></span>
        </div>
        <input type="range" min="0" max="${cap}" step="25" value="${S.bids[j]||0}" id="bid${j}">
      </div>`);
      step.querySelector('.opts').appendChild(row);
    });
    app.appendChild(step);
  }

  app.insertAdjacentHTML('beforeend', mapSVG(v));
  /* The number goes ABOVE the choices it is meant to inform. Before anything
     is picked it shows the best run on the board, so the screen never opens
     with the question unanswered. */
  {
    const sel = S.sel.p !== undefined && S.sel.c !== undefined;
    const bst = sel ? null : bestRun(v);
    if (sel) app.insertAdjacentHTML('beforeend', projCard(v, S.sel.p, S.sel.c, undefined));
    else if (bst) app.insertAdjacentHTML('beforeend',
      projCard(v, bst.p, bst.c, undefined,
        `the best on the board: ${GOODS[bst.c]} out of ${b.pick[bst.p].name}`));
  }

  /* where to load */
  const s2 = $(`<div class="step" data-step="pickup"><div class="lab"><span class="n">2</span>
    &nbsp;Fly out to</div><div class="opts"></div></div>`);
  b.reachP[you.at].forEach((p) => {
    const cheapest = Math.min(...v.prices.buy[p]);
    const serves = b.reachD[p].map((d) => b.drop[d].name.split(' ')[0]).join(' · ');
    const shed = ((v.sheds && v.sheds.stock) || [])
      .filter((x) => x.p === p).reduce((a, x) => a + x.units, 0);
    const btn = $(`<button class="opt tall" aria-pressed="${S.sel.p === p}">
      <span class="nm">${b.pick[p].name}<br><span class="meta">ships to ${serves}${
        shed ? ` · <b style="color:var(--blue)" title="Stock in sheds here. It holds the buy price down for whoever loads, and never costs them anything — the money for it goes to whoever left it.">${shed} in sheds</b>` : ''}</span></span>
      <span class="px">${px(cheapest)}<span class="meta"> low</span></span></button>`);
    btn.onclick = () => { S.sel = { p }; render(); };
    s2.querySelector('.opts').appendChild(btn);
  });
  app.appendChild(s2);

  /* what to load */
  if (S.sel.p !== undefined) {
    const s3 = $(`<div class="step" data-step="cargo"><div class="lab"><span class="n">3</span>
      &nbsp;Load up on</div><div class="opts chips"></div></div>`);
    for (let c = 0; c < 5; c++) {
      const bp = v.prices.buy[S.sel.p][c];
      const best = b.reachD[S.sel.p].reduce((a, d) => v.prices.sell[d][c] > v.prices.sell[a][c] ? d : a,
                                            b.reachD[S.sel.p][0]);
      const marg = v.prices.sell[best][c] - bp;
      const r = projectRun(v, S.sel.p, c);
      const btn = $(`<button class="opt" aria-pressed="${S.sel.c === c}">
        <span class="nm">${GOODS[c]}<br><span class="meta">buy ${px(bp)} · sell ${
          px(v.prices.sell[best][c])}</span></span>
        <span class="px ${r ? cls(r.alone) : cls(marg)}">${
          r ? money(Math.round(r.alone)) : (marg>=0?'+':'−') + px(Math.abs(marg))}</span></button>`);
      btn.onclick = () => { S.sel = { p: S.sel.p, c }; render(); };
      s3.querySelector('.opts').appendChild(btn);
    }
    app.appendChild(s3);
  }

  /* ---- THE SHED -------------------------------------------------------

     Every other way to play this game is about getting away from the crowd.
     This is the one where you want the crowd to turn up: goods left at a
     loading spot earn nothing until somebody comes and buys that cargo at
     that rock, and then you take a cut of what they sell it for — without
     them ever learning whose it was.

     Bought ON TOP of a full hold, deliberately. If storage came out of the
     hold it would carry the hold's opportunity cost and the whole point would
     be lost; that mistake cost the mechanic $49,000 a season in the harness
     before anybody noticed. */
  if (S.sel.p !== undefined && S.sel.c !== undefined && v.sheds && v.sheds.on) {
    const bp = v.prices.buy[S.sel.p][S.sel.c];
    const here = (v.sheds.mine || []).find((x) => x.p === S.sel.p && x.c === S.sel.c);
    const pub = (v.sheds.stock || []).find((x) => x.p === S.sel.p && x.c === S.sel.c);
    const most = Math.min(v.sheds.max, Math.floor(Math.max(0, you.cash) / Math.max(bp, 1)));
    if (S.store === undefined) S.store = 0;
    if (S.collect === undefined) S.collect = 0;
    const st = $(`<div class="step" data-step="shed"><div class="lab"><span class="n">4</span>
      &nbsp;Leave some behind</div></div>`);
    const card = $(`<div class="card"></div>`);
    if (!v.sheds.canStore) {
      card.innerHTML = `<p class="note">The sheds are shut for the last
        ${v.sheds.windDown} rounds — there is no longer time for anybody to come
        past and load it.</p>`;
    } else {
      card.innerHTML = `
        <p class="note" style="margin:0 0 10px">Buy extra ${GOODS[S.sel.c]} at
          ${b.pick[S.sel.p].name} and leave it in a rented shed. It does not use your
          hold. Any captain loading ${GOODS[S.sel.c]} here takes it out of the pile and
          pays <b>you</b> the going rate instead of the market — and anything still
          here at the end of the season is sold back at the posted price. Rent is
          ${money(v.sheds.rent)} a unit a round until it moves. It is a bet on the
          price and a way to sit out of the crowd; it is not a way to get rich.</p>
        <input type="range" id="store" min="0" max="${most}" step="1" value="${Math.min(S.store, most)}">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="note" id="storeq">${S.store} units</span>
          <span class="note" id="storec"></span>
        </div>`;
    }
    if (pub && pub.units > 0) {
      card.insertAdjacentHTML('beforeend', `<p class="note" style="margin-top:10px">
        There ${pub.units === 1 ? 'is' : 'are'} already <b>${pub.units}</b> units of
        ${GOODS[S.sel.c]} sitting here${here ? ` — <b>${here.units}</b> of them yours` : ''}.
        Stock is supply: it holds the buy price down for everyone loading here, and
        loading it costs you no more than an empty rock would — the money just goes
        to whoever left it rather than to the market.</p>`);
    }
    if (here && here.units > 0) {
      card.insertAdjacentHTML('beforeend', `<label style="display:flex;gap:8px;
        align-items:center;margin-top:10px;font-size:13.5px;color:var(--ink)">
        <input type="checkbox" id="collect" ${S.collect ? 'checked' : ''}>
        Take my ${Math.min(here.units, you.hold)} units back into the hold this run</label>`);
    }
    st.appendChild(card);
    app.appendChild(st);
  }

  const ready = S.sel.p !== undefined && S.sel.c !== undefined;
  const d = $(`<div class="inner">
    <div class="fc"><small id="fs">${ready ? 'Loading at ' + b.pick[S.sel.p].name : 'Pick a spot and a cargo'}</small>
      <span class="v ${ready?'':'muted'}" id="fv">${ready ? GOODS[S.sel.c] : '—'}</span></div>
    <button class="go" ${ready?'':'disabled'}>File manifest and bids</button></div>`);
  d.querySelector('.go').onclick = async () => {
    if (!ready || S.busy) return;
    S.busy = true;
    try {
      const out = await api('cargo/declare', { pickup: S.sel.p, commodity: S.sel.c, bids: S.bids,
        store: S.store || 0, collect: S.collect || 0 });
      S.sel = {}; S.bids = []; S.store = 0; S.collect = 0; S.busy = false;
      return applyView(out.view);
    } catch (e) { S.error = e.message; }
    S.busy = false; render();
  };
  dock.appendChild(d);
  if (S.error) app.insertAdjacentHTML('beforeend', `<p class="err">${S.error}</p>`);

  /* live bid readouts */
  if (v.block) {
    const paint = () => {
      v.block.grades.forEach((g, j) => {
        const el = document.getElementById('bv' + j), eu = document.getElementById('bu' + j);
        const val = S.bids[j] || 0, full = v.block.worth[j];
        if (el) { el.textContent = val < 1 ? '—' : money(val);
                  el.className = 'px ' + (val < 1 ? 'muted' : val > full + 1 ? 'b' : 'g'); }
        /* what the bid works out at per unit of hold per round — the number
           that decides a season, against the ~$46 a unit returns */
        if (eu) {
          const units = full / (v.perUnit || 46);
          eu.innerHTML = val < 1 ? '&nbsp;'
            : `<span style="color:var(--${(val/Math.max(units,0.01)) > v.perUnit ? 'bad':'good'})">$${
                Math.round(val / Math.max(units, 0.01))}</span> a unit`;
        }
      });
    };
    v.block.grades.forEach((g, j) => {
      const sl = document.getElementById('bid' + j);
      if (sl) sl.addEventListener('input', (e) => { S.bids[j] = Number(e.target.value); paint(); });
    });
    paint();
  }
  /* the shed's live readout, the same shape as the bid sliders above it */
  {
    const sl = document.getElementById('store');
    if (sl) {
      const bp2 = v.prices.buy[S.sel.p][S.sel.c];
      const paint = () => {
        const n = Number(sl.value) || 0;
        S.store = n;
        const q = document.getElementById('storeq'), cst = document.getElementById('storec');
        if (q) q.textContent = n === 0 ? 'nothing' : n + ' units';
        if (cst) cst.innerHTML = n === 0 ? '&nbsp;'
          : `${money(n * bp2)} now · ${money(n * v.sheds.rent)} a round in rent`;
      };
      sl.addEventListener('input', paint);
      paint();
    }
    const cb = document.getElementById('collect');
    if (cb) cb.addEventListener('change', (e) => {
      S.collect = e.target.checked ? 9999 : 0;   /* the server clamps to the pile */
    });
  }
  poll(8000);
}

/* ---- stage two: the manifests are out ----------------------------------- */
/* THE ENVELOPES.

   The yard settles between the two windows now, so this is where a captain
   finds out what their sealed bid bought — and, just as usefully, what it
   nearly bought. Every bid is shown with a name against it: a reveal that
   named only the winner would leave everyone guessing how close they came,
   which is the one thing that teaches you how to bid next week.

   It also matters for the decision being made on this very screen. The part
   somebody just won is fitted NOW, so the holds in this table are what every
   rival can actually carry on the run you are about to route. */
function yardCard(v) {
  const r = v.refit;
  if (!r) return '';
  const me = (v.seats || []).findIndex((s) => s.you);
  let t = `<div class="card"><h2>The yard — envelopes opened</h2><table>
    <tr><th>Lot</th><th>Condition</th><th>Won by</th><th>Paid</th></tr>`;
  r.lots.forEach((l) => {
    const mine = l.who === me;
    t += `<tr class="${mine ? 'you' : ''}"><td>${l.lot + 1}</td>
      <td class="muted">${CONDITION(l.grade)}</td>
      <td>${l.who < 0 ? '<span class="muted">nobody bid</span>'
                      : (mine ? 'You' : r.names[l.who])}</td>
      <td>${l.who < 0 ? '—' : money(l.paid)}</td></tr>`;
  });
  t += `</table>`;
  /* what everybody put in, which is the part worth studying */
  t += `<table style="margin-top:10px"><tr><th>Captain</th>${
    r.lots.map((l) => `<th>Lot ${l.lot + 1}</th>`).join('')}<th>Hold</th></tr>`;
  r.names.forEach((n, i) => {
    const mine = i === me;
    t += `<tr class="${mine ? 'you' : ''}"><td>${mine ? 'You' : n}</td>${
      r.lots.map((l) => {
        const bid = l.bids[i];
        const won = l.who === i;
        return `<td class="${won ? 'g' : bid === null || bid < 1 ? 'muted' : ''}">${
          bid === null ? '—' : bid < 1 ? 'no bid' : money(bid)}${won ? ' ✓' : ''}</td>`;
      }).join('')}<td>${r.holdNow[i]}${
        r.holdNow[i] !== r.holdWas[i]
          ? ` <span class="${r.holdNow[i] > r.holdWas[i] ? 'g' : 'b'}">${
              r.holdNow[i] > r.holdWas[i] ? '+' : '−'}${
              Math.abs(r.holdNow[i] - r.holdWas[i])}</span>` : ''}</td></tr>`;
  });
  t += '</table>';
  if (r.scrapped && r.scrapped.length) {
    t += `<p class="note" style="margin-top:8px">${
      r.scrapped.map((i) => i === me ? 'You' : r.names[i]).join(', ')} won nothing and took the
      yard's scrap part, which is fitted for free and is worse than anything in the block.</p>`;
  }
  t += `<p class="note" style="margin-top:8px">Fitted now, not next week — whatever was won is
    carrying cargo on this run, and the holds above are what everyone can lift.</p></div>`;
  return t;
}

function screenRoute(app, dock, v) {
  const you = v.you, b = v.board;
  app.insertAdjacentHTML('beforeend', head(v));
  app.insertAdjacentHTML('beforeend', yardCard(v));
  app.insertAdjacentHTML('beforeend', shedCard(v));

  let m = `<div class="card"><h2>Manifests filed</h2><table>
    <tr><th>Captain</th><th>Loading</th><th>Could sell at</th></tr>`;
  (v.manifests || []).forEach((x) => {
    m += `<tr class="${x.you ? 'you' : ''}"><td>${x.you ? 'You' : x.name}</td>
      <td>${GOODS[x.c]}<br><span class="meta">at ${b.pick[x.p].name}</span></td>
      <td class="muted">${x.couldSell.map((d) => b.drop[d].name.split(' ')[0]).join('<br>')}</td></tr>`;
  });
  app.insertAdjacentHTML('beforeend', m + '</table></div>');

  const sharing = (v.manifests || []).filter((x) => !x.you && x.c === you.declared.c);
  if (sharing.length) {
    const where = [...new Set(sharing.flatMap((x) => x.couldSell))]
      .filter((d) => b.reachD[you.declared.p].includes(d)).map((d) => b.drop[d].name.split(' ')[0]);
    app.insertAdjacentHTML('beforeend', `<div class="card"><h2>Watch out</h2><p class="note">
      ${sharing.length === 1 ? 'One other captain is' : sharing.length + ' others are'} carrying
      ${GOODS[you.declared.c]} too${where.length ? `, and could land at <b>${where.join(' or ')}</b>` : ''}.
      Meet them there and you all get less for it.</p></div>`);
  }

  if (you.routed) {
    app.insertAdjacentHTML('beforeend', `<div class="card"><h2>Filed</h2>
      <p class="note">Selling at ${b.drop[you.routed.d].name}. Waiting for
      ${v.seats.filter((s) => !s.filed).length} more.</p></div>`);
    poll(3000);
    return;
  }

  S.sel = { p: you.declared.p, c: you.declared.c, d: S.sel.d };
  app.insertAdjacentHTML('beforeend', mapSVG(v));

  /* The projection sits ABOVE the choices, not below them. Under the station
     buttons it ended up behind the dock, which is the one place on a phone
     where a number is guaranteed not to be read. */
  const ready = S.sel.d !== undefined;
  if (ready) app.insertAdjacentHTML('beforeend',
    projCard(v, you.declared.p, you.declared.c, S.sel.d));

  const step = $(`<div class="step" data-step="port"><div class="lab"><span class="n">4</span>
    &nbsp;Sell it at</div><div class="opts"></div></div>`);
  b.reachD[you.declared.p].forEach((d) => {
    /* what this station pays, on the button, so the three can be compared
       without picking each one in turn */
    const r = projectRun(v, you.declared.p, you.declared.c, d);
    const rivals = r ? r.risk : 0;
    const pay = r ? r.alone : null;
    const btn = $(`<button class="opt tall" aria-pressed="${S.sel.d === d}">
      <span class="nm">${b.drop[d].name}<br><span class="meta">sells at ${
        px(v.prices.sell[d][you.declared.c])}${
        rivals ? ' · ' + rivals + ' other' + (rivals > 1 ? 's' : '') + ' could land here' : ''}</span></span>
      <span class="px ${pay === null ? '' : cls(pay)}">${pay === null ? '' : money(Math.round(pay))}</span></button>`);
    btn.onclick = () => { S.sel = { ...S.sel, d }; render(); };
    step.querySelector('.opts').appendChild(btn);
  });
  app.appendChild(step);

  const pick = ready ? projectRun(v, you.declared.p, you.declared.c, S.sel.d) : null;
  const payNow = pick ? pick.alone : null;
  const d = $(`<div class="inner">
    <div class="fc"><small>${ready ? b.drop[S.sel.d].name : 'Pick a station'}</small>
      <span class="v ${ready ? cls(payNow) : 'muted'}">${
        ready ? money(Math.round(payNow)) : '—'}</span></div>
    <button class="go" ${ready?'':'disabled'}>File the route</button></div>`);
  d.querySelector('.go').onclick = async () => {
    if (!ready || S.busy) return;
    S.busy = true;
    try {
      const out = await api('cargo/route', { drop: S.sel.d });
      S.sel = {}; S.busy = false;
      /* filing last closes the round, so the film may start the moment the
         button is released — which is the good version of waiting */
      return applyView(out.view);
    } catch (e) { S.error = e.message; }
    S.busy = false; render();
  };
  dock.appendChild(d);
  poll(8000);
}

function screenOver(app, dock, v) {
  const fin = [...v.seats].sort((a, b) => b.cash - a.cash);
  const place = fin.findIndex((s) => s.you) + 1;
  app.insertAdjacentHTML('beforeend', head(v));
  app.insertAdjacentHTML('beforeend', `<div class="card"><h2>${v.rounds} rounds done</h2>
    <div class="big">${['','First','Second','Third','Fourth','Fifth'][place] || place}</div></div>`);
  let t = `<div class="card"><h2>Final</h2><table>
    <tr><th>Captain</th><th>Ship</th><th>On parts</th><th>Cash</th></tr>`;
  fin.forEach((s) => { t += `<tr class="${s.you?'you':''}"><td>${s.name}</td>
    <td>${s.ship}%</td><td class="muted">${money(s.onParts||0)}</td>
    <td>${money(s.cash)}</td></tr>`; });
  app.insertAdjacentHTML('beforeend', t + `</table>
    <p class="note" style="margin-top:10px">The best ship wins about one season in eight — a
    contested auction prices quality at close to what it is worth, so the captain who wins is
    the one who got a decent ship <b>cheaply</b>.</p></div>`);

  /* WHO THEY ACTUALLY WERE. Withheld all season on purpose; withholding it now
     would just be refusing to answer the first question anybody asks. */
  if (v.who && v.who.length) {
    let w = `<div class="card"><h2>Who you were playing against</h2><table>
      <tr><th>Captain</th><th>What it was</th></tr>`;
    v.who.forEach((x) => {
      w += `<tr class="${x.you ? 'you' : ''}"><td>${x.you ? 'You' : x.name}</td>
        <td class="muted">${x.you ? 'you' : x.isBot ? x.style : 'a person'}</td></tr>`;
    });
    const people = v.who.filter((x) => !x.isBot).length;
    app.insertAdjacentHTML('beforeend', w + `</table><p class="note" style="margin-top:8px">${
      people === 1 ? 'You were the only person at this table — the other four were the yard\'s own captains.'
                   : people + ' of the five were people. Nobody was told which, all season.'}</p></div>`);
  }
  const d = $(`<div class="inner"><button class="go">Another table</button></div>`);
  d.querySelector('.go').onclick = () => {
    S = { code: null, token: null, view: null, sel: {}, bids: [], store: 0, collect: 0, busy: false, error: null, name: S.name };
    try { localStorage.removeItem(KEY); } catch {}
    render();
  };
  dock.appendChild(d);
}

/* ======================================================================
   THE RESOLUTION, WATCHED

   Everything below draws one round that has already happened. It is handed
   the `replay` block the server recorded while settling — where each ship
   started, what it carried, what the market did to it, and every bid in the
   yard — and it never works anything out for itself. A drawing that recomputes
   the economy is a second copy of the economy waiting to disagree with the
   first, and this page has gone to some trouble not to have one.

   The clock is the only state. Every position, every number and every panel is
   a pure function of it, which is what makes Skip a one-liner rather than an
   unwinding.
   ====================================================================== */
const FILM = {
  /* No yard beat. The refit now settles between the two windows and is read
     off the envelopes screen before a port is even chosen, so replaying it
     here would be showing somebody a thing they already watched. */
  T: { out: 2.4, load: 1.2, run: 2.7, market: 2.4 },
  reel: null, ctx: null, t: 0, raf: 0, data: null, view: null, done: null,
};
FILM.LEN = Object.values(FILM.T).reduce((a, b) => a + b, 0);
const GOOD_COLOUR = ['#8b9bb4','#d8c47a','#5fd08a','#7fd4ff','#c98fe0'];
const fease = (u) => u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
const f01 = (u) => Math.max(0, Math.min(1, u));
const flerp = (a, b, u) => a + (b - a) * u;

function filmPhase(t) {
  let acc = 0;
  for (const [name, len] of Object.entries(FILM.T)) {
    if (t < acc + len) return { name, u: (t - acc) / len };
    acc += len;
  }
  return { name: 'market', u: 1 };
}

/* Only ever plays a round you were actually at, and only once — a refresh or a
   second tab should not replay a week you have already watched. */
function maybePlayFilm(view) {
  const h = (view.history || [])[0];
  if (!h || !h.replay) return false;
  /* Once per browser rather than once per tab: reloading the page should not
     replay a week you have already watched, and a second tab should not play it
     at you again. */
  let seen = 0;
  try { seen = Number(localStorage.getItem('cargo.seen.' + view.code) || 0); } catch {}
  if (h.replay.round <= seen) return false;
  try { localStorage.setItem('cargo.seen.' + view.code, String(h.replay.round)); } catch {}
  playFilm(view, h.replay);
  return true;
}

function playFilm(view, data) {
  FILM.data = data; FILM.view = view; FILM.t = 0;
  const wrap = document.getElementById('film');
  wrap.hidden = false;
  FILM.reel = document.getElementById('reel');
  FILM.ctx = FILM.reel.getContext('2d');
  filmLayout();
  document.getElementById('skip').onclick = endFilm;
  FILM.reel.onclick = endFilm;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    FILM.t += dt;
    if (FILM.t >= FILM.LEN) return endFilm();
    drawFilm();
    FILM.raf = requestAnimationFrame(step);
  };
  FILM.raf = requestAnimationFrame(step);
}
function endFilm() {
  cancelAnimationFrame(FILM.raf);
  document.getElementById('film').hidden = true;
  FILM.data = null;
  render();
}

let FW = 0, FH = 0, FPAD = { x: 0, y: 0 }, FSCALE = 1;
function filmLayout() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  FW = FILM.reel.clientWidth; FH = FILM.reel.clientHeight;
  FILM.reel.width = Math.round(FW * dpr); FILM.reel.height = Math.round(FH * dpr);
  FILM.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const top = 62;
  const usable = Math.min(FW - 20, FH - top - 230);
  FSCALE = usable / 100;
  FPAD = { x: (FW - usable) / 2, y: top };
}
window.addEventListener('resize', () => { if (FILM.data) filmLayout(); });
const fx = (x) => FPAD.x + x * FSCALE;
const fy = (y) => FPAD.y + y * FSCALE;

const FSTARS = (() => {
  let s = 987654;
  const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  return Array.from({ length: 180 }, () => ({ x: r(), y: r(), z: 0.3 + r() * 0.7 }));
})();

function filmShip(d, i, ph) {
  const b = FILM.view.board;
  const from = b.drop[d.at[i]], to = b.pick[d.declared[i].p], end = b.drop[d.rows[i].d];
  let a = from, z = to, u = 0, flying = false, face = to;
  if (ph.name === 'out') { u = fease(ph.u); flying = true; }
  else if (ph.name === 'load') { a = to; z = to; face = end; }
  else if (ph.name === 'run') { a = to; z = end; u = fease(ph.u); flying = true; face = end; }
  else if (ph.name !== 'out') { a = end; z = end; face = null; }
  const ref = face || to;
  const ang = (a === z) ? Math.atan2(ref.y - a.y, ref.x - a.x) || 0
                        : Math.atan2(z.y - a.y, z.x - a.x);
  return { x: flerp(a.x, z.x, u), y: flerp(a.y, z.y, u), ang, flying, a, b: z, u };
}

function drawFilm() {
  const g = FILM.ctx, d = FILM.data, v = FILM.view, t = FILM.t;
  const me = v.seats.findIndex((s) => s.you);
  const ph = filmPhase(t);
  g.fillStyle = '#070b12'; g.fillRect(0, 0, FW, FH);

  for (const s of FSTARS) {
    const x = FPAD.x + ((s.x * 110 + (t * 2 * s.z) % 110) % 110 - 5) * FSCALE;
    const y = FPAD.y + s.y * 100 * FSCALE;
    if (x < FPAD.x - 4 || x > FPAD.x + 100 * FSCALE + 4) continue;
    g.fillStyle = `rgba(200,220,255,${(0.1 + 0.45 * s.z).toFixed(3)})`;
    g.fillRect(x, y, s.z * 1.6, s.z * 1.6);
  }

  /* the lanes, then the places */
  const b = v.board;
  g.lineWidth = 1; g.strokeStyle = 'rgba(90,120,170,0.10)';
  b.pick.forEach((p) => { for (const q of b.reachD[p.i]) {
    const st = b.drop[q];
    g.beginPath(); g.moveTo(fx(p.x), fy(p.y)); g.lineTo(fx(st.x), fy(st.y)); g.stroke(); } });
  b.pick.forEach((p) => {
    const busy = d.rows.filter((r) => r.p === p.i).length;
    g.beginPath(); g.arc(fx(p.x), fy(p.y), 1.2 * FSCALE, 0, 7);
    g.fillStyle = busy ? '#3d5580' : '#22304a'; g.fill();
  });
  b.drop.forEach((st) => {
    const sz = 2.4 * FSCALE;
    g.save(); g.translate(fx(st.x), fy(st.y)); g.rotate(Math.PI / 4);
    g.fillStyle = '#2b3a55'; g.fillRect(-sz/2, -sz/2, sz, sz); g.restore();
    g.fillStyle = 'rgba(230,237,247,0.55)';
    g.font = `${Math.max(9, 3.1 * FSCALE)}px ui-sans-serif,sans-serif`;
    g.textAlign = 'center';
    g.fillText(st.name.split(' ')[0], fx(st.x), fy(st.y) - 3 * FSCALE);
  });

  /* the ships */
  for (let i = v.seats.length - 1; i >= 0; i--) {
    const mine = i === me;
    const st = filmShip(d, i, ph);
    const x = fx(st.x), y = fy(st.y), size = (mine ? 2.1 : 1.8) * FSCALE;
    if (st.flying && st.u > 0.01) {
      const back = Math.min(0.28, st.u);
      const tx = fx(flerp(st.a.x, st.b.x, st.u - back)), ty = fy(flerp(st.a.y, st.b.y, st.u - back));
      const grd = g.createLinearGradient(tx, ty, x, y);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(1, mine ? 'rgba(242,193,78,0.55)' : 'rgba(127,147,181,0.32)');
      g.strokeStyle = grd; g.lineWidth = mine ? 2.4 : 1.6; g.lineCap = 'round';
      g.beginPath(); g.moveTo(tx, ty); g.lineTo(x, y); g.stroke();
    }
    g.save(); g.translate(x, y); g.rotate(st.ang);
    if (mine) { g.shadowColor = 'rgba(242,193,78,0.8)'; g.shadowBlur = 12; }
    g.beginPath();
    g.moveTo(size, 0); g.lineTo(-size * 0.7, size * 0.62);
    g.lineTo(-size * 0.35, 0); g.lineTo(-size * 0.7, -size * 0.62);
    g.closePath(); g.fillStyle = mine ? '#f2c14e' : '#7f93b5'; g.fill();
    g.shadowBlur = 0;
    if (ph.name === 'run' || ph.name === 'market') {
      g.beginPath(); g.arc(-size * 0.25, 0, size * 0.38, 0, 7);
      g.fillStyle = GOOD_COLOUR[d.rows[i].c]; g.fill();
    }
    g.restore();
    if (ph.name === 'out' || ph.name === 'load') {
      g.fillStyle = mine ? 'rgba(242,193,78,0.95)' : 'rgba(150,170,200,0.7)';
      g.font = `${Math.max(8, 2.7 * FSCALE)}px ui-sans-serif,sans-serif`;
      g.textAlign = 'center';
      g.fillText(mine ? 'YOU' : d.names[i].split(' ')[0], x, y - size - 4);
    }
  }

  /* the crowd, which is the whole game in one label */
  const crowd = (keyOf, placeOf, dy, word, pct) => {
    const by = new Map();
    d.rows.forEach((r, i) => { const k = keyOf(r); by.set(k, (by.get(k) || []).concat(r)); });
    for (const [, rows] of by) {
      if (rows.length < 2) continue;
      const p = placeOf(rows[0]);
      filmFlash(fx(p.x), fy(p.y) + dy, `${rows.length} ${word} · ${pct(rows[0])}`, '#ff7a6b', ph.u);
    }
  };
  if (ph.name === 'load')
    crowd((r) => r.p + ':' + r.c, (r) => b.pick[r.p], -5 * FSCALE, 'buying',
          (r) => Math.round((r.paid / d.prices.buy[r.p][r.c] - 1) * 100) + '% dearer');
  if (ph.name === 'market')
    crowd((r) => r.d + ':' + r.c, (r) => b.drop[r.d], 5 * FSCALE, 'selling',
          (r) => Math.round((1 - r.got / d.prices.sell[r.d][r.c]) * 100) + '% less');

  /* what each captain made, stacked so a busy station stays readable */
  if (ph.name === 'market') {
    const byStation = new Map();
    d.rows.forEach((r, i) => byStation.set(r.d, (byStation.get(r.d) || []).concat({ r, i })));
    for (const [d0, list] of byStation) {
      const st = b.drop[d0];
      list.sort((a, z) => z.r.profit - a.r.profit);
      list.forEach(({ r, i }, k) => {
        g.save();
        g.globalAlpha = f01(1.6 - ph.u * 1.6);
        g.font = `600 ${Math.max(11, (i === me ? 4.2 : 3.1) * FSCALE)}px ui-sans-serif,sans-serif`;
        g.textAlign = 'center';
        g.fillStyle = r.profit >= 0 ? '#5fd08a' : '#ff7a6b';
        g.fillText((r.profit >= 0 ? '+' : '−') + '$' + Math.abs(r.profit).toLocaleString(),
          fx(st.x), fy(st.y) - fease(f01(ph.u * 1.4)) * 4 * FSCALE - (2.4 + k * 2.1) * FSCALE);
        g.restore();
      });
    }
  }

  filmBoard(d, ph, me);
  filmHUD(d, ph, me);
}

function filmFlash(x, y, text, colour, u) {
  const g = FILM.ctx;
  g.save();
  g.globalAlpha = f01(Math.sin(f01(u) * Math.PI) * 1.6);
  g.font = `600 ${Math.max(10, 3.0 * FSCALE)}px ui-sans-serif,sans-serif`;
  g.textAlign = 'center';
  const w = g.measureText(text).width + 14;
  const cx = Math.max(w / 2 + 8, Math.min(FW - w / 2 - 8, x));
  g.fillStyle = 'rgba(10,14,23,0.85)';
  g.beginPath(); g.roundRect(cx - w/2, y - 11, w, 20, 6); g.fill();
  g.strokeStyle = colour; g.lineWidth = 1; g.stroke();
  g.fillStyle = colour; g.fillText(text, cx, y + 4);
  g.restore();
}

/* the band under the square map, which is where the table lives */
function filmBoard(d, ph, me) {
  const g = FILM.ctx;
  const y0 = FPAD.y + 100 * FSCALE + 16, y1 = FH - 104;
  if (y1 - y0 < 60) return;
  const rowH = Math.min(34, (y1 - y0 - 22) / d.rows.length);
  const takings = ph.name === 'market';
  g.save();
  g.textAlign = 'left'; g.fillStyle = '#5a6d8c';
  g.font = '600 10px ui-sans-serif,sans-serif';
  g.fillText(takings ? 'WHAT THEY MADE' : 'MANIFESTS FILED', 18, y0 + 8);
  const order = d.rows.map((r, i) => i)
    .sort((a, z) => (takings ? d.rows[z].profit - d.rows[a].profit : a - z));
  order.forEach((i, k) => {
    const y = y0 + 22 + k * rowH + rowH * 0.62, r = d.rows[i], mine = i === me;
    if (mine) {
      g.fillStyle = 'rgba(242,193,78,0.07)';
      g.beginPath(); g.roundRect(12, y - rowH * 0.62, FW - 24, rowH - 2, 6); g.fill();
    }
    g.fillStyle = mine ? '#f2c14e' : '#7f93b5';
    g.font = `${mine ? 600 : 400} 12px ui-sans-serif,sans-serif`;
    g.textAlign = 'left';
    g.fillText(mine ? 'You' : d.names[i].split(' ')[0], 18, y);
    g.beginPath(); g.arc(104, y - 4, 4, 0, 7); g.fillStyle = GOOD_COLOUR[r.c]; g.fill();
    g.fillStyle = mine ? '#e6edf7' : '#5a6d8c';
    g.font = '12px ui-sans-serif,sans-serif';
    g.fillText(GOODS[r.c], 114, y);
    g.textAlign = 'right';
    if (takings) {
      g.fillStyle = r.profit >= 0 ? '#5fd08a' : '#ff7a6b';
      g.font = '600 12px ui-sans-serif,sans-serif';
      g.fillText((r.profit >= 0 ? '+' : '−') + '$' + Math.abs(r.profit).toLocaleString(), FW - 18, y);
      g.fillStyle = '#4a5d7c'; g.font = '11px ui-sans-serif,sans-serif';
      g.fillText(FILM.view.board.drop[r.d].name.split(' ')[0], FW - 96, y);
    } else {
      g.fillStyle = '#4a5d7c'; g.font = '11px ui-sans-serif,sans-serif';
      g.fillText('at ' + FILM.view.board.pick[r.p].name, FW - 18, y);
    }
  });
  g.restore();
}

function filmHUD(d, ph, me) {
  const g = FILM.ctx;
  g.textAlign = 'left'; g.fillStyle = '#5a6d8c';
  g.font = '600 11px ui-sans-serif,sans-serif';
  g.fillText(`ROUND ${d.round}`, 16, 30);
  let shown = d.before.cash[me];
  if (ph.name === 'market') shown = flerp(d.before.cash[me], d.after.cash[me], fease(ph.u));
  g.textAlign = 'right'; g.fillStyle = '#e6edf7';
  g.font = '600 22px ui-sans-serif,sans-serif';
  g.fillText('$' + Math.round(shown).toLocaleString(), FW - 16, 32);
  g.fillStyle = '#5a6d8c'; g.font = '11px ui-sans-serif,sans-serif';
  /* the hold no longer changes during the film — the yard settled before the
     run and this ship flew with what it won */
  g.fillText('hold ' + Math.round(d.before.hold[me]) + ' units', FW - 16, 48);
  if (ph.name === 'run' || ph.name === 'market') {
    const r = d.rows[me];
    g.textAlign = 'left'; g.fillStyle = GOOD_COLOUR[r.c];
    g.font = '600 12px ui-sans-serif,sans-serif';
    g.fillText(r.load + ' ' + GOODS[r.c] + ' → ' + FILM.view.board.drop[r.d].name, 16, 50);
  }
}

/* WHICH BUILD THIS IS.

   CEO carries this at the foot of its page and Cargo Run did not, which cost
   two rounds of "is my change live?" that nobody could answer by looking.
   Both halves are shown because they are uploaded separately and it is
   entirely possible to have one without the other. */
const PAGE_BUILD = '2026-09-20 · a shed sells its goods';
async function stamp() {
  let server = 'not reached';
  try {
    const r = await fetch('/api/config');
    if (r.ok) { const j = await r.json(); server = j.build || 'unknown'; }
  } catch {}
  const el = document.getElementById('build');
  if (el) el.textContent = `page ${PAGE_BUILD} · server ${server}`;
}

/* ------------------------------------------------------------------ start */
(async () => {
  stamp();
  const saved = load();
  /* a code in the address bar wins over whatever was last played here, so a
     link a friend sends does what it looks like it does */
  const fromUrl = (location.pathname.match(/\/c\/([A-Za-z0-9]{4,8})/) || [])[1];
  if (fromUrl) { S.code = fromUrl.toUpperCase(); }
  else if (saved.code) { S.code = saved.code; S.token = saved.token; }
  if (S.code && S.token) { await refresh(); poll(5000); }
  else render();
})();
</script>
